<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yaver</title><link rel="icon" href="icon.png"><style>
:root{--bg:#16171a;--panel:#1f2023;--fg:#e7e7e9;--muted:#9a9ea7;--accent:#f0a43a;--border:#34363b}
@media (prefers-color-scheme: light){:root{--bg:#f6f5f2;--panel:#fff;--fg:#1d1d1f;--muted:#5e6168;--accent:#b8730f;--border:#e2e0db}}
*{box-sizing:border-box}html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 "Segoe UI",system-ui,-apple-system,"Yu Gothic UI","Malgun Gothic","Microsoft YaHei UI",sans-serif}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--border);z-index:2}
.bar{max-width:860px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;color:var(--fg);text-decoration:none}
.brand img{width:32px;height:32px;border-radius:8px}
select{margin-left:auto;background:var(--panel);color:var(--fg);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font:inherit;font-size:14px}
main{max-width:860px;margin:0 auto;padding:24px 16px 64px}
article{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:28px clamp(16px,4vw,40px)}
h1{color:var(--accent);font-size:clamp(24px,4vw,32px);line-height:1.25;margin:0 0 12px}
h2{font-size:20px;margin:32px 0 8px}
ul{padding-left:22px}li{margin:4px 0}
a{color:var(--accent)}
.hero{text-align:center;padding:56px 16px}
.hero img{width:112px;height:112px;border-radius:24px}
.hero h1{font-size:clamp(32px,6vw,48px);color:var(--fg);margin:16px 0 8px}
.hero p{color:var(--muted);font-size:18px;max-width:560px;margin:0 auto 24px}
.btn{display:inline-block;background:var(--accent);color:#141414;font-weight:700;padding:12px 22px;border-radius:10px;text-decoration:none;margin:6px}
.btn.alt{background:transparent;color:var(--fg);border:1px solid var(--border)}
footer{color:var(--muted);font-size:13px;text-align:center;padding:24px}
</style></head>
<body><main><div class="hero"><img src="icon.png" alt="Yaver">
<h1>Yaver</h1><p>AI assistant that looks at your screen and uses the mouse and keyboard for you.</p>
<a class="btn" href="https://apps.microsoft.com/detail/9NSJHKBMQKGS">Microsoft Store</a><a class="btn alt" href="privacy.html">Privacy &amp; Terms</a></div></main>
<footer>Support: <a href="mailto:ozdoganburak2@gmail.com">ozdoganburak2@gmail.com</a></footer></body></html>
