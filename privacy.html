aver виконує від вашого імені, зокрема за надіслані повідомлення, змінені або видалені файли та оформлені замовлення.</li>\n<li>Команди PowerShell завжди показуються вам на підтвердження. Не дозволяйте виконання команди, якщо не розумієте, що вона робить.</li>\n</ul>\n<h2>3. Заборонене використання</h2>\n<p>Ви не можете використовувати Yaver, щоб:</p>\n<ul>\n<li>Вчиняти будь-які протиправні дії.</li>\n<li>Керувати комп&#x27;ютером або обліковим записом без дозволу їхнього власника.</li>\n<li>Розсилати небажані повідомлення (спам), створювати фальшиві облікові записи або видавати себе за інших осіб.</li>\n<li>Обходити CAPTCHA, захист від ботів або заходи безпеки.</li>\n<li>Порушувати права, недоторканність приватного життя або безпеку інших осіб.</li>\n<li>Намагатися обійти, піддати зворотному проєктуванню або використовувати на шкоду сервер Yaver, обмеження використання чи заходи безпеки.</li>\n</ul>\n<h2>4. Які дані обробляються?</h2>\n<p><strong>Знімки екрана й команди.</strong> Під час виконання завдання Yaver передає знімки вашого екрана (усіх моніторів, якщо їх кілька й це дозволяють ваші налаштування) та введені вами команди через сервер Yaver постачальникові ШІ DeepSeek. Усе, що в цю мить видно на екрані, — відкриті документи, електронні листи, повідомлення, особиста інформація — потрапляє на знімок. Не залишайте на екрані інформацію, якою не хочете ділитися, поки працює Yaver.</p>\n<p><strong>Сервер Yaver не зберігає ваші знімки екрана й команди.</strong> Вони обробляються виключно для передавання до DeepSeek.</p>\n<p><strong>DeepSeek.</strong> DeepSeek — постачальник ШІ, розташований у Китайській Народній Республіці. На надіслані дані поширюються власна політика конфіденційності та умови використання DeepSeek; дані можуть оброблятися на серверах у Китаї.</p>\n<p><strong>Дані, що зберігаються для дотримання ліміту.</strong> Для застосування денного ліміту використання сервер зберігає: анонімний ідентифікатор сеансу, який застосунок створює під час першого запуску, незворотний дайджест (хеш) вашої IP-адреси та кількість ваших кроків за день. Ваше ім&#x27;я, електронна пошта чи інші ідентифікаційні дані не запитуються. Денні лічильники видаляються через 7 днів. Сервер працює на інфраструктурі Supabase у центрах обробки даних у Європейському Союзі.</p>\n<p><strong>Журнали інфраструктури.</strong> Supabase, що надає серверну інфраструктуру, може зберігати вашу IP-адресу та відомості про пристрій і застосунок у записах сеансів і журналах сервера з метою безпеки та експлуатації протягом власних строків зберігання. Анонімні сеанси, які не використовуються 30 днів, видаляються разом із записами сеансів.</p>\n<p><strong>Що залишається на вашому комп&#x27;ютері.</strong> Ваші налаштування, історія команд і дані сеансу зберігаються лише на вашому комп&#x27;ютері.</p>\n<p><strong>Ваші права.</strong> Щоб скористатися своїми правами відповідно до чинного законодавства про захист даних (наприклад, GDPR або турецького KVKK), напишіть на контактну адресу, зазначену нижче.</p>\n<h2>5. Ліміти використання</h2>\n<p>Yaver безкоштовний і має денний ліміт для справедливого використання: 150 кроків на користувача на день (кожне рішення агента — один крок; типове завдання займає 3–8 кроків). Ліміт скидається щодня о 00:00 за турецьким часом (UTC+3). Якщо загальну потужність сервера вичерпано, роботу сервісу може бути призупинено до кінця цього дня. Ліміти можуть бути змінені без попереднього повідомлення. У разі виявлення зловживань доступ може бути обмежено.</p>\n<h2>6. Відмова від гарантій</h2>\n<p>Yaver надається «як є» та «за наявності». Не гарантується, що він працюватиме безперебійно, без помилок або підходитиме для будь-якої конкретної мети. Сервіс може бути змінено, призупинено або припинено будь-коли.</p>\n<h2>7. Обмеження відповідальності</h2>\n<p>У максимальному обсязі, дозволеному чинним законодавством, розробник Yaver не несе відповідальності за будь-які прямі чи непрямі збитки, що виникли внаслідок використання або неможливості використання Yaver, зокрема за втрату даних, пошкодження файлів, фінансові збитки, упущену вигоду, помилково надіслані повідомлення або дії, виконані ШІ. Ваші законні права споживача, які не можуть бути обмежені договором, залишаються чинними.</p>\n<h2>8. Інтелектуальна власність</h2>\n<p>Програмне забезпечення, назва та логотип Yaver належать його розробникові. Вам надається право використовувати Yaver в особистих цілях; ви не маєте права копіювати, змінювати, здавати в оренду або повторно розповсюджувати його.</p>\n<h2>9. Зміни та припинення</h2>\n<p>Ці умови можуть оновлюватися. У разі суттєвих змін Yaver покаже вам нові умови й знову попросить вашої згоди для продовження використання. У разі порушення вами цих умов ваш доступ до сервісу може бути припинено. Ви можете будь-коли припинити використання Yaver, видаливши його.</p>\n<h2>10. Вікові вимоги</h2>\n<p>Щоб користуватися Yaver, вам має бути щонайменше 18 років, або ви повинні використовувати його з дозволу та під наглядом одного з батьків чи законного опікуна.</p>\n<h2>11. Застосовне право</h2>\n<p>Ці умови регулюються законодавством Турецької Республіки. Спори розглядаються судами та виконавчими органами Стамбула без шкоди для імперативних норм про підсудність за місцем вашого проживання як споживача.</p>\n<h2>12. Контакти</h2>\n<p>З питань, запитів і звернень щодо захисту даних: <a href=\"mailto:ozdoganburak2@gmail.com\">ozdoganburak2@gmail.com</a></p>", "pl": "<h1>Warunki korzystania z Yaver i informacja o prywatności</h1>\n<p>Wersja 1.0 · Data wejścia w życie: 2 listopada 2026 r.</p>\n<p>Przed rozpoczęciem korzystania z Yaver przeczytaj niniejsze warunki. Naciskając „Akceptuję”, potwierdzasz, że przeczytałeś(-aś) i zrozumiałeś(-aś) niniejsze warunki oraz że je akceptujesz. Jeśli się z nimi nie zgadzasz, nie korzystaj z Yaver.</p>\n<h2>1. Czym jest Yaver?</h2>\n<p>Yaver to asystent AI, który obsługuje Twój komputer z systemem Windows w Twoim imieniu. Aby wykonać Twoje polecenie, robi zrzuty ekranu, wysyła je do modelu AI i — na podstawie decyzji modelu — porusza myszą, klika, pisze na klawiaturze i naciska skróty klawiszowe.</p>\n<p>Oznacza to, że w czasie działania Yaver kontrola nad Twoim komputerem zostaje tymczasowo przekazana sztucznej inteligencji.</p>\n<h2>2. Twoja odpowiedzialność</h2>\n<ul>\n<li>AI może popełniać błędy: może kliknąć w niewłaściwe miejsce, wpisać niewłaściwy tekst, źle zrozumieć Twoje polecenie lub wykonać nieoczekiwaną czynność.</li>\n<li>Twoim obowiązkiem jest obserwowanie ekranu w czasie działania Yaver i zatrzymanie go w razie potrzeby. Aby go zatrzymać, naciśnij Ctrl+Alt+D lub Esc albo przesuń kursor myszy do lewego górnego rogu ekranu.</li>\n<li>Rób kopie zapasowe ważnych plików.</li>\n<li>Nie używaj Yaver do zadań, w których błąd może mieć poważne konsekwencje, takich jak przelewy pieniężne, płatności, handel na rynkach finansowych, operacje na kontach i hasłach, oficjalne wnioski czy decyzje prawne lub medyczne.</li>\n<li>Ponosisz odpowiedzialność za każdą czynność wykonaną przez Yaver w Twoim imieniu, w tym za wysłane wiadomości, zmienione lub usunięte pliki oraz złożone zamówienia.</li>\n<li>Polecenia PowerShell są zawsze przedstawiane Ci do zatwierdzenia. Nie zezwalaj na wykonanie polecenia, jeśli nie rozumiesz, co ono robi.</li>\n</ul>\n<h2>3. Zabronione sposoby korzystania</h2>\n<p>Nie wolno Ci używać Yaver do:</p>\n<ul>\n<li>Jakichkolwiek działań niezgodnych z prawem.</li>\n<li>Obsługi komputera lub konta bez zgody jego właściciela.</li>\n<li>Wysyłania niezamówionych wiadomości (spamu), zakładania fałszywych kont lub podszywania się pod inne osoby.</li>\n<li>Obchodzenia zabezpieczeń CAPTCHA, ochrony przed botami lub innych środków bezpieczeństwa.</li>\n<li>Naruszania praw, prywatności lub bezpieczeństwa innych osób.</li>\n<li>Prób obejścia, odtworzenia kodu (inżynierii wstecznej) lub nadużywania serwera Yaver, limitów korzystania lub środków bezpieczeństwa.</li>\n</ul>\n<h2>4. Jakie dane są przetwarzane?</h2>\n<p><strong>Zrzuty ekranu i polecenia.</strong> Podczas wykonywania zadania Yaver wysyła zrzuty Twojego ekranu (wszystkich monitorów, jeśli masz ich więcej niż jeden, a Twoje ustawienia na to pozwalają) oraz wpisywane przez Ciebie polecenia za pośrednictwem serwera Yaver do dostawcy AI — DeepSeek. Wszystko, co jest w danej chwili widoczne na ekranie — otwarte dokumenty, e-maile, wiadomości, dane osobowe — trafia na zrzut ekranu. W czasie działania Yaver nie pozostawiaj na ekranie informacji, których nie chcesz udostępniać.</p>\n<p><strong>Serwer Yaver nie przechowuje Twoich zrzutów ekranu ani poleceń.</strong> Są one przetwarzane wyłącznie w celu przekazania ich do DeepSeek.</p>\n<p><strong>DeepSeek.</strong> DeepSeek to dostawca AI z siedzibą w Chińskiej Republice Ludowej. Przesyłane dane podlegają własnej polityce prywatności i warunkom korzystania DeepSeek i mogą być przetwarzane na serwerach w Chinach.</p>\n<p><strong>Informacje przechowywane na potrzeby limitu korzystania.</strong> W celu egzekwowania dziennego limitu korzystania serwer przechowuje: anonimowy identyfikator sesji tworzony przez aplikację przy pierwszym uruchomieniu, nieodwracalny skrót (hash) Twojego adresu IP oraz Twoją dzienną liczbę kroków. Nie prosimy o Twoje imię i nazwisko, adres e-mail ani żadne inne dane identyfikujące. Dzienne liczniki są usuwane po 7 dniach. Serwer działa na infrastrukturze Supabase w centrach danych na terenie Unii Europejskiej.</p>\n<p><strong>Rejestry infrastruktury.</strong> Supabase, dostawca infrastruktury serwerowej, może przechowywać Twój adres IP oraz informacje o urządzeniu i aplikacji w rejestrach sesji i dziennikach serwera w celach bezpieczeństwa i eksploatacyjnych, przez własne okresy przechowywania. Anonimowe sesje nieużywane przez 30 dni są usuwane wraz z ich rejestrami sesji.</p>\n<p><strong>Co pozostaje na Twoim komputerze.</strong> Twoje ustawienia, historia poleceń i informacje o sesji są przechowywane wyłącznie na Twoim komputerze.</p>\n<p><strong>Twoje prawa.</strong> Aby skorzystać z praw przysługujących Ci na mocy obowiązujących przepisów o ochronie danych (takich jak GDPR lub turecka ustawa KVKK), napisz na podany niżej adres kontaktowy.</p>\n<h2>5. Limity korzystania</h2>\n<p>Yaver jest bezpłatny i w celu zapewnienia uczciwego korzystania obowiązuje dzienny limit: 150 kroków na użytkownika dziennie (każda decyzja agenta to jeden krok; typowe zadanie zajmuje 3–8 kroków). Limit odnawia się codziennie o 00:00 czasu tureckiego (UTC+3). Jeśli zostanie osiągnięta łączna przepustowość serwera, usługa może zostać wstrzymana do końca danego dnia. Limity mogą ulec zmianie bez uprzedniego powiadomienia. W przypadku wykrycia nadużyć dostęp może zostać ograniczony.</p>\n<h2>6. Brak gwarancji</h2>\n<p>Yaver jest udostępniany „w stanie, w jakim jest” i „w miarę dostępności”. Nie gwarantuje się, że będzie działał bez przerw, bez błędów ani że będzie przydatny do określonego celu. Usługa może zostać w dowolnym momencie zmieniona, zawieszona lub zakończona.</p>\n<h2>7. Ograniczenie odpowiedzialności</h2>\n<p>W najszerszym zakresie dozwolonym przez obowiązujące prawo twórca Yaver nie ponosi odpowiedzialności za jakiekolwiek bezpośrednie lub pośrednie szkody wynikające z korzystania lub niemożności korzystania z Yaver, w tym za utratę danych, uszkodzenie plików, straty finansowe, utratę zysków, omyłkowo wysłane wiadomości lub czynności wykonane przez AI. Nie narusza to Twoich ustawowych praw jako konsumenta, których nie można ograniczyć umową.</p>\n<h2>8. Własność intelektualna</h2>\n<p>Oprogramowanie, nazwa i logo Yaver należą do jego twórcy. Przysługuje Ci prawo do korzystania z Yaver na własny użytek osobisty; nie wolno Ci go kopiować, modyfikować, wynajmować ani dalej rozpowszechniać.</p>\n<h2>9. Zmiany i rozwiązanie</h2>\n<p>Niniejsze warunki mogą być aktualizowane. W przypadku istotnej zmiany Yaver wyświetli Ci nowe warunki i ponownie poprosi o Twoją zgodę na dalsze korzystanie. Jeśli naruszysz niniejsze warunki, Twój dostęp do usługi może zostać zakończony. W każdej chwili możesz zaprzestać korzystania z Yaver, odinstalowując go.</p>\n<h2>10. Wymagany wiek</h2>\n<p>Aby korzystać z Yaver, musisz mieć ukończone 18 lat albo korzystać z niego za zgodą i pod nadzorem rodzica lub opiekuna prawnego.</p>\n<h2>11. Prawo właściwe</h2>\n<p>Niniejsze warunki podlegają prawu Republiki Turcji. Do rozstrzygania sporów właściwe są sądy i organy egzekucyjne w Stambule, bez uszczerbku dla bezwzględnie obowiązujących przepisów o właściwości miejsca Twojego zamieszkania jako konsumenta.</p>\n<h2>12. Kontakt</h2>\n<p>W sprawie pytań, wniosków i zapytań dotyczących ochrony danych: <a href=\"mailto:ozdoganburak2@gmail.com\">ozdoganburak2@gmail.com</a></p>", "nl": "<h1>Gebruiksvoorwaarden en privacyverklaring van Yaver</h1>\n<p>Versie 1.0 · Ingangsdatum: 2 november 2026</p>\n<p>Lees deze voorwaarden voordat je Yaver gebruikt. Door op &quot;Ik ga akkoord&quot; te drukken, bevestig je dat je deze voorwaarden hebt gelezen en begrepen en dat je ermee akkoord gaat. Als je niet akkoord gaat, gebruik Yaver dan niet.</p>\n<h2>1. Wat is Yaver?</h2>\n<p>Yaver is een AI-assistent die je Windows-computer namens jou bedient. Om je opdracht uit te voeren, maakt Yaver schermafbeeldingen van je scherm, stuurt deze naar een AI-model en beweegt — op basis van de beslissingen van het model — de muis, klikt, typt op het toetsenbord en drukt op sneltoetsen.</p>\n<p>Dit betekent dat terwijl Yaver actief is, de controle over je computer tijdelijk aan een AI wordt overgedragen.</p>\n<h2>2. Jouw verantwoordelijkheid</h2>\n<ul>\n<li>De AI kan fouten maken: hij kan op de verkeerde plek klikken, de verkeerde tekst typen, je opdracht verkeerd begrijpen of een onverwachte handeling uitvoeren.</li>\n<li>Het is jouw verantwoordelijkheid om het scherm in de gaten te houden terwijl Yaver actief is en Yaver zo nodig te stoppen. Druk om te stoppen op Ctrl+Alt+D of Esc, of beweeg de muis naar de linkerbovenhoek van het scherm.</li>\n<li>Maak back-ups van je belangrijke bestanden.</li>\n<li>Gebruik Yaver niet voor taken waarbij een fout ernstige gevolgen kan hebben, zoals geldoverboekingen, betalingen, handelen op financiële markten, account- en wachtwoordhandelingen, officiële aanvragen, of juridische of medische beslissingen.</li>\n<li>Je bent verantwoordelijk voor elke handeling die Yaver namens jou uitvoert, inclusief verzonden berichten, gewijzigde of verwijderde bestanden en geplaatste bestellingen.</li>\n<li>PowerShell-opdrachten worden je altijd ter goedkeuring voorgelegd. Sta een opdracht niet toe als je niet begrijpt wat die doet.</li>\n</ul>\n<h2>3. Verboden gebruik</h2>\n<p>Je mag Yaver niet gebruiken om:</p>\n<ul>\n<li>Iets te doen wat in strijd is met de wet.</li>\n<li>Een computer of account te bedienen zonder toestemming van de eigenaar.</li>\n<li>Ongevraagde berichten (spam) te versturen, nepaccounts aan te maken of je voor te doen als iemand anders.</li>\n<li>CAPTCHA&#x27;s, botbescherming of beveiligingsmaatregelen te omzeilen.</li>\n<li>De rechten, privacy of veiligheid van anderen te schenden.</li>\n<li>Te proberen de server, gebruikslimieten of beveiligingsmaatregelen van Yaver te omzeilen, te reverse-engineeren of te misbruiken.</li>\n</ul>\n<h2>4. Welke gegevens worden verwerkt?</h2>\n<p><strong>Schermafbeeldingen en opdrachten.</strong> Tijdens het uitvoeren van een taak stuurt Yaver schermafbeeldingen van je scherm (van alle monitoren, als je er meer dan één hebt en je instellingen dit toestaan) en de opdrachten die je typt via de Yaver-server naar de AI-aanbieder DeepSeek. Alles wat op dat moment op het scherm zichtbaar is — geopende documenten, e-mails, berichten, persoonlijke gegevens — komt in de schermafbeelding terecht. Laat geen informatie die je niet wilt delen zichtbaar op het scherm staan terwijl Yaver actief is.</p>\n<p><strong>De Yaver-server slaat je schermafbeeldingen en opdrachten niet op.</strong> Ze worden uitsluitend verwerkt om ze door te sturen naar DeepSeek.</p>\n<p><strong>DeepSeek.</strong> DeepSeek is een AI-aanbieder gevestigd in de Volksrepubliek China. De verzonden gegevens vallen onder het eigen privacybeleid en de eigen gebruiksvoorwaarden van DeepSeek en kunnen op servers in China worden verwerkt.</p>\n<p><strong>Gegevens die voor de gebruikslimiet worden bewaard.</strong> Om de dagelijkse gebruikslimiet te handhaven, bewaart de server: een anonieme sessie-ID die de app bij de eerste start aanmaakt, een onomkeerbare samenvatting (hash) van je IP-adres en je dagelijkse aantal stappen. Er wordt niet om je naam, e-mailadres of andere identificerende gegevens gevraagd. Dagelijkse tellers worden na 7 dagen verwijderd. De server draait op de infrastructuur van Supabase in datacenters in de Europese Unie.</p>\n<p><strong>Infrastructuurlogboeken.</strong> Supabase, dat de serverinfrastructuur levert, kan je IP-adres en apparaat- en app-informatie voor beveiligings- en operationele doeleinden in sessierecords en serverlogboeken bewaren, gedurende de eigen bewaartermijnen. Anonieme sessies die 30 dagen niet worden gebruikt, worden samen met hun sessierecords verwijderd.</p>\n<p><strong>Wat op je computer blijft.</strong> Je instellingen, opdrachtgeschiedenis en sessiegegevens worden uitsluitend op je computer opgeslagen.</p>\n<p><strong>Je rechten.</strong> Om je rechten op grond van de toepasselijke wetgeving inzake gegevensbescherming (zoals de GDPR of de Turkse KVKK) uit te oefenen, kun je schrijven naar het contactadres hieronder.</p>\n<h2>5. Gebruikslimieten</h2>\n<p>Yaver is gratis en heeft een dagelijkse limiet voor eerlijk gebruik: 150 stappen per gebruiker per dag (elke beslissing van de agent is één stap; een gemiddelde taak kost 3–8 stappen). De limiet wordt elke dag om 00:00 Turkse tijd (UTC+3) gereset. Als de totale capaciteit van de server is bereikt, kan de dienst voor de rest van die dag worden onderbroken. Limieten kunnen zonder voorafgaande kennisgeving worden gewijzigd. Bij vastgesteld misbruik kan de toegang worden beperkt.</p>\n<h2>6. Geen garantie</h2>\n<p>Yaver wordt geleverd &quot;in de huidige staat&quot; en &quot;zoals beschikbaar&quot;. Er wordt niet gegarandeerd dat Yaver zonder onderbreking, zonder fouten of voor een bepaald doel werkt. De dienst kan op elk moment worden gewijzigd, opgeschort of beëindigd.</p>\n<h2>7. Beperking van aansprakelijkheid</h2>\n<p>Voor zover maximaal toegestaan door het toepasselijke recht is de ontwikkelaar van Yaver niet aansprakelijk voor enige directe of indirecte schade die voortvloeit uit het gebruik of het niet kunnen gebruiken van Yaver, waaronder gegevensverlies, beschadiging van bestanden, financieel verlies, winstderving, verkeerd verzonden berichten of handelingen die door de AI zijn uitgevoerd. Je wettelijke rechten als consument die niet bij overeenkomst kunnen worden beperkt, blijven onverlet.</p>\n<h2>8. Intellectueel eigendom</h2>\n<p>De software, naam en het logo van Yaver zijn eigendom van de ontwikkelaar. Je krijgt het recht om Yaver voor persoonlijk gebruik te gebruiken; je mag Yaver niet kopiëren, wijzigen, verhuren of opnieuw verspreiden.</p>\n<h2>9. Wijzigingen en beëindiging</h2>\n<p>Deze voorwaarden kunnen worden bijgewerkt. Bij een belangrijke wijziging toont Yaver je de nieuwe voorwaarden en vraagt opnieuw om je toestemming om verder te gaan. Als je deze voorwaarden schendt, kan je toegang tot de dienst worden beëindigd. Je kunt op elk moment stoppen met het gebruik van Yaver door het te verwijderen.</p>\n<h2>10. Leeftijdsvereiste</h2>\n<p>Om Yaver te gebruiken moet je minimaal 18 jaar oud zijn, of Yaver gebruiken met toestemming en onder toezicht van je ouder of wettelijke voogd.</p>\n<h2>11. Toepasselijk recht</h2>\n<p>Op deze voorwaarden is het recht van de Republiek Turkije van toepassing. De rechtbanken en executiekantoren van Istanbul zijn bevoegd om geschillen te beslechten, onverminderd de dwingende bevoegdheidsregels van je woonplaats als consument.</p>\n<h2>12. Contact</h2>\n<p>Voor vragen, verzoeken en vragen over gegevensbescherming: <a href=\"mailto:ozdoganburak2@gmail.com\">ozdoganburak2@gmail.com</a></p>", "id": "<h1>Ketentuan Penggunaan dan Pemberitahuan Privasi Yaver</h1>\n<p>Versi 1.0 · Tanggal berlaku: 2 November 2026</p>\n<p>Harap baca ketentuan ini sebelum menggunakan Yaver. Dengan menekan &quot;Saya setuju&quot;, Anda menyatakan bahwa Anda telah membaca, memahami, dan menyetujui ketentuan ini. Jika Anda tidak setuju, jangan gunakan Yaver.</p>\n<h2>1. Apa itu Yaver?</h2>\n<p>Yaver adalah asisten AI yang mengoperasikan komputer Windows Anda atas nama Anda. Untuk menjalankan perintah Anda, Yaver mengambil tangkapan layar dari layar Anda, mengirimkannya ke model AI, dan — berdasarkan keputusan model — menggerakkan mouse, mengeklik, mengetik di keyboard, dan menekan tombol pintasan.</p>\n<p>Artinya, selama Yaver berjalan, kendali atas komputer Anda untuk sementara diserahkan kepada AI.</p>\n<h2>2. Tanggung jawab Anda</h2>\n<ul>\n<li>AI dapat melakukan kesalahan: AI dapat mengeklik tempat yang salah, mengetik teks yang salah, salah memahami perintah Anda, atau melakukan tindakan yang tidak terduga.</li>\n<li>Anda bertanggung jawab untuk mengawasi layar selama Yaver berjalan dan menghentikannya bila perlu. Untuk menghentikannya, tekan Ctrl+Alt+D atau Esc, atau gerakkan mouse ke sudut kiri atas layar.</li>\n<li>Cadangkan file-file penting Anda.</li>\n<li>Jangan gunakan Yaver untuk tugas yang kesalahannya dapat berakibat serius, seperti transfer uang, pembayaran, perdagangan (trading), operasi akun dan kata sandi, pengajuan resmi, atau keputusan hukum maupun medis.</li>\n<li>Anda bertanggung jawab atas setiap tindakan yang dilakukan Yaver atas nama Anda, termasuk pesan yang dikirim, file yang diubah atau dihapus, serta pesanan yang dibuat.</li>\n<li>Perintah PowerShell selalu ditampilkan kepada Anda untuk disetujui. Jangan izinkan perintah jika Anda tidak memahami fungsinya.</li>\n</ul>\n<h2>3. Penggunaan yang dilarang</h2>\n<p>Anda tidak boleh menggunakan Yaver untuk:</p>\n<ul>\n<li>Melakukan apa pun yang melanggar hukum.</li>\n<li>Mengoperasikan komputer atau akun tanpa izin pemiliknya.</li>\n<li>Mengirim pesan yang tidak diminta (spam), membuat akun palsu, atau menyamar sebagai orang lain.</li>\n<li>Menembus CAPTCHA, perlindungan bot, atau langkah keamanan.</li>\n<li>Melanggar hak, privasi, atau keamanan orang lain.</li>\n<li>Mencoba menembus, merekayasa balik (reverse-engineer), atau menyalahgunakan server, batas penggunaan, atau langkah keamanan Yaver.</li>\n</ul>\n<h2>4. Data apa yang diproses?</h2>\n<p><strong>Tangkapan layar dan perintah.</strong> Saat menjalankan tugas, Yaver mengirimkan tangkapan layar dari layar Anda (semua monitor, jika Anda memiliki lebih dari satu dan pengaturan Anda mengizinkannya) serta perintah yang Anda ketik melalui server Yaver kepada penyedia AI DeepSeek. Apa pun yang terlihat di layar pada saat itu — dokumen yang terbuka, email, pesan, informasi pribadi — akan ikut masuk ke dalam tangkapan layar. Jangan biarkan informasi yang tidak ingin Anda bagikan terlihat di layar selama Yaver berjalan.</p>\n<p><strong>Server Yaver tidak menyimpan tangkapan layar atau perintah Anda.</strong> Keduanya hanya diproses untuk diteruskan kepada DeepSeek.</p>\n<p><strong>DeepSeek.</strong> DeepSeek adalah penyedia AI yang berbasis di Republik Rakyat Tiongkok. Data yang dikirim tunduk pada kebijakan privasi dan ketentuan penggunaan DeepSeek sendiri dan dapat diproses di server yang berada di Tiongkok.</p>\n<p><strong>Informasi yang disimpan untuk batas penggunaan.</strong> Untuk menerapkan batas penggunaan harian, server menyimpan: ID sesi anonim yang dibuat oleh aplikasi saat pertama kali dijalankan, ringkasan (hash) alamat IP Anda yang tidak dapat dikembalikan, dan jumlah langkah harian Anda. Nama, email, atau informasi identitas lainnya tidak diminta. Penghitung harian dihapus setelah 7 hari. Server berjalan di infrastruktur Supabase di pusat data yang berada di Uni Eropa.</p>\n<p><strong>Catatan infrastruktur.</strong> Supabase, penyedia infrastruktur server, dapat menyimpan alamat IP serta informasi perangkat dan aplikasi Anda dalam catatan sesi dan log server untuk keperluan keamanan dan operasional, selama jangka waktu penyimpanannya sendiri. Sesi anonim yang tidak digunakan selama 30 hari dihapus beserta catatan sesinya.</p>\n<p><strong>Apa yang tetap di komputer Anda.</strong> Pengaturan, riwayat perintah, dan informasi sesi Anda hanya disimpan di komputer Anda.</p>\n<p><strong>Hak Anda.</strong> Untuk menggunakan hak Anda berdasarkan undang-undang perlindungan data yang berlaku (seperti GDPR atau KVKK Turki), kirimkan surat ke alamat kontak di bawah ini.</p>\n<h2>5. Batas penggunaan</h2>\n<p>Yaver gratis dan memiliki batas harian demi penggunaan yang adil: 150 langkah per pengguna per hari (setiap keputusan agen adalah satu langkah; tugas biasa memerlukan 3–8 langkah). Batas ini direset setiap hari pukul 00:00 waktu Turki (UTC+3). Jika kapasitas total server tercapai, layanan dapat dihentikan sementara untuk sisa hari tersebut. Batas dapat berubah tanpa pemberitahuan sebelumnya. Akses dapat dibatasi jika terdeteksi penyalahgunaan.</p>\n<h2>6. Tanpa jaminan</h2>\n<p>Yaver disediakan &quot;sebagaimana adanya&quot; dan &quot;sebagaimana tersedia&quot;. Tidak ada jaminan bahwa Yaver akan berfungsi tanpa gangguan, tanpa kesalahan, atau untuk tujuan tertentu. Layanan dapat diubah, ditangguhkan, atau dihentikan kapan saja.</p>\n<h2>7. Batasan tanggung jawab</h2>\n<p>Sejauh diizinkan sepenuhnya oleh hukum yang berlaku, pengembang Yaver tidak bertanggung jawab atas kerugian langsung maupun tidak langsung apa pun yang timbul dari penggunaan atau ketidakmampuan menggunakan Yaver, termasuk kehilangan data, kerusakan file, kerugian finansial, kehilangan keuntungan, pesan yang salah terkirim, atau tindakan yang dilakukan oleh AI. Hak hukum Anda sebagai konsumen yang tidak dapat dibatasi melalui perjanjian tetap tidak terpengaruh.</p>\n<h2>8. Kekayaan intelektual</h2>\n<p>Perangkat lunak, nama, dan logo Yaver adalah milik pengembangnya. Anda diberikan hak untuk menggunakan Yaver untuk penggunaan pribadi Anda; Anda tidak boleh menyalin, mengubah, menyewakan, atau mendistribusikan ulang Yaver.</p>\n<h2>9. Perubahan dan pengakhiran</h2>\n<p>Ketentuan ini dapat diperbarui. Jika terdapat perubahan yang signifikan, Yaver akan menampilkan ketentuan baru kepada Anda dan meminta persetujuan Anda kembali untuk melanjutkan. Akses Anda ke layanan dapat diakhiri jika Anda melanggar ketentuan ini. Anda dapat berhenti menggunakan Yaver kapan saja dengan menghapus instalasinya.</p>\n<h2>10. Persyaratan usia</h2>\n<p>Untuk menggunakan Yaver, Anda harus berusia minimal 18 tahun, atau menggunakannya dengan izin dan di bawah pengawasan orang tua atau wali sah Anda.</p>\n<h2>11. Hukum yang berlaku</h2>\n<p>Ketentuan ini diatur oleh hukum Republik Turki. Pengadilan dan kantor eksekusi Istanbul berwenang atas sengketa, tanpa mengurangi aturan yurisdiksi wajib di tempat tinggal Anda sebagai konsumen.</p>\n<h2>12. Kontak</h2>\n<p>Untuk pertanyaan, permintaan, dan pertanyaan terkait perlindungan data: <a href=\"mailto:ozdoganburak2@gmail.com\">ozdoganburak2@gmail.com</a></p>", "vi": "<h1>Điều khoản sử dụng và Thông báo về quyền riêng tư của Yaver</h1>\n<p>Phiên bản 1.0 · Ngày có hiệu lực: ngày 2 tháng 11 năm 2026</p>\n<p>Vui lòng đọc các điều khoản này trước khi sử dụng Yaver. Khi nhấn &quot;Tôi đồng ý&quot;, bạn xác nhận rằng bạn đã đọc, hiểu và đồng ý với các điều khoản này. Nếu bạn không đồng ý, đừng sử dụng Yaver.</p>\n<h2>1. Yaver là gì?</h2>\n<p>Yaver là một trợ lý AI thay bạn điều khiển máy tính Windows của bạn. Để thực hiện lệnh của bạn, Yaver chụp ảnh màn hình, gửi ảnh đó đến một mô hình AI và — dựa trên quyết định của mô hình — di chuyển chuột, nhấp chuột, gõ bàn phím và nhấn các phím tắt.</p>\n<p>Điều này có nghĩa là trong khi Yaver đang chạy, quyền điều khiển máy tính của bạn tạm thời được giao cho AI.</p>\n<h2>2. Trách nhiệm của bạn</h2>\n<ul>\n<li>AI có thể mắc lỗi: nó có thể nhấp nhầm chỗ, gõ sai nội dung, hiểu sai lệnh của bạn hoặc thực hiện một thao tác ngoài dự kiến.</li>\n<li>Bạn có trách nhiệm theo dõi màn hình trong khi Yaver đang chạy và dừng Yaver khi cần thiết. Để dừng, hãy nhấn Ctrl+Alt+D hoặc Esc, hoặc di chuyển chuột lên góc trên bên trái màn hình.</li>\n<li>Hãy sao lưu các tệp quan trọng của bạn.</li>\n<li>Không sử dụng Yaver cho những công việc mà sai sót có thể gây hậu quả nghiêm trọng, chẳng hạn như chuyển tiền, thanh toán, giao dịch mua bán tài chính, thao tác với tài khoản và mật khẩu, nộp hồ sơ chính thức, hoặc các quyết định pháp lý hay y tế.</li>\n<li>Bạn chịu trách nhiệm về mọi thao tác mà Yaver thực hiện thay bạn, bao gồm tin nhắn đã gửi, tệp đã bị thay đổi hoặc xóa, và đơn hàng đã đặt.</li>\n<li>Các lệnh PowerShell luôn được hiển thị để bạn phê duyệt. Đừng cho phép một lệnh nếu bạn không hiểu lệnh đó làm gì.</li>\n</ul>\n<h2>3. Các hành vi sử dụng bị cấm</h2>\n<p>Bạn không được sử dụng Yaver để:</p>\n<ul>\n<li>Thực hiện bất kỳ hành vi trái pháp luật nào.</li>\n<li>Điều khiển máy tính hoặc tài khoản khi chưa được chủ sở hữu cho phép.</li>\n<li>Gửi tin nhắn không mong muốn (spam), tạo tài khoản giả hoặc mạo danh người khác.</li>\n<li>Vượt qua CAPTCHA, cơ chế chống bot hoặc các biện pháp bảo mật.</li>\n<li>Xâm phạm quyền, quyền riêng tư hoặc an ninh của người khác.</li>\n<li>Tìm cách vượt qua, dịch ngược (reverse-engineer) hoặc lạm dụng máy chủ, giới hạn sử dụng hoặc các biện pháp bảo mật của Yaver.</li>\n</ul>\n<h2>4. Những dữ liệu nào được xử lý?</h2>\n<p><strong>Ảnh chụp màn hình và lệnh.</strong> Trong khi thực hiện một tác vụ, Yaver gửi ảnh chụp màn hình của bạn (tất cả các màn hình, nếu bạn có nhiều hơn một màn hình và cài đặt của bạn cho phép) cùng các lệnh bạn nhập, thông qua máy chủ Yaver, đến nhà cung cấp AI DeepSeek. Bất cứ thứ gì hiển thị trên màn hình vào thời điểm đó — tài liệu đang mở, email, tin nhắn, thông tin cá nhân — đều nằm trong ảnh chụp màn hình. Đừng để thông tin mà bạn không muốn chia sẻ hiển thị trên màn hình trong khi Yaver đang chạy.</p>\n<p><strong>Máy chủ Yaver không lưu trữ ảnh chụp màn hình hay lệnh của bạn.</strong> Chúng chỉ được xử lý để chuyển tiếp đến DeepSeek.</p>\n<p><strong>DeepSeek.</strong> DeepSeek là nhà cung cấp AI có trụ sở tại Cộng hòa Nhân dân Trung Hoa. Dữ liệu được gửi đi chịu sự điều chỉnh của chính sách quyền riêng tư và điều khoản sử dụng riêng của DeepSeek và có thể được xử lý trên các máy chủ tại Trung Quốc.</p>\n<p><strong>Thông tin được lưu giữ cho giới hạn sử dụng.</strong> Để áp dụng giới hạn sử dụng hằng ngày, máy chủ lưu giữ: một mã phiên ẩn danh do ứng dụng tạo ra trong lần khởi động đầu tiên, một bản tóm lược (hash) không thể đảo ngược của địa chỉ IP của bạn, và số bước hằng ngày của bạn. Tên, email hay bất kỳ thông tin định danh nào khác của bạn đều không được yêu cầu. Bộ đếm hằng ngày sẽ bị xóa sau 7 ngày. Máy chủ chạy trên hạ tầng Supabase tại các trung tâm dữ liệu ở Liên minh châu Âu.</p>\n<p><strong>Nhật ký hạ tầng.</strong> Supabase, đơn vị cung cấp hạ tầng máy chủ, có thể lưu địa chỉ IP và thông tin thiết bị/ứng dụng của bạn trong bản ghi phiên và nhật ký máy chủ cho mục đích bảo mật và vận hành, theo thời hạn lưu trữ riêng của họ. Các phiên ẩn danh không được sử dụng trong 30 ngày sẽ bị xóa cùng với bản ghi phiên.</p>\n<p><strong>Những gì được giữ lại trên máy tính của bạn.</strong> Cài đặt, lịch sử lệnh và thông tin phiên của bạn chỉ được lưu trữ trên máy tính của bạn.</p>\n<p><strong>Quyền của bạn.</strong> Để thực hiện các quyền của bạn theo luật bảo vệ dữ liệu hiện hành (chẳng hạn như GDPR hoặc KVKK của Thổ Nhĩ Kỳ), hãy gửi thư đến địa chỉ liên hệ dưới đây.</p>\n<h2>5. Giới hạn sử dụng</h2>\n<p>Yaver miễn phí và có giới hạn hằng ngày để đảm bảo sử dụng công bằng: 150 bước cho mỗi người dùng mỗi ngày (mỗi quyết định của tác tử là một bước; một tác vụ thông thường cần 3–8 bước). Giới hạn được đặt lại mỗi ngày lúc 00:00 theo giờ Thổ Nhĩ Kỳ (UTC+3). Nếu máy chủ đạt tổng công suất, dịch vụ có thể tạm dừng trong thời gian còn lại của ngày hôm đó. Các giới hạn có thể thay đổi mà không cần thông báo trước. Quyền truy cập có thể bị hạn chế nếu phát hiện hành vi lạm dụng.</p>\n<h2>6. Không bảo đảm</h2>\n<p>Yaver được cung cấp &quot;nguyên trạng&quot; và &quot;tùy theo khả năng sẵn có&quot;. Không có bảo đảm nào rằng Yaver sẽ hoạt động không gián đoạn, không có lỗi hoặc phù hợp với bất kỳ mục đích cụ thể nào. Dịch vụ có thể được thay đổi, tạm ngừng hoặc chấm dứt vào bất kỳ lúc nào.</p>\n<h2>7. Giới hạn trách nhiệm</h2>\n<p>Trong phạm vi tối đa được pháp luật hiện hành cho phép, nhà phát triển Yaver không chịu trách nhiệm đối với bất kỳ thiệt hại trực tiếp hay gián tiếp nào phát sinh từ việc sử dụng hoặc không thể sử dụng Yaver, bao gồm mất dữ liệu, hư hỏng tệp, tổn thất tài chính, mất lợi nhuận, tin nhắn bị gửi nhầm hoặc các thao tác do AI thực hiện. Các quyền hợp pháp của bạn với tư cách là người tiêu dùng mà không thể bị hạn chế bằng hợp đồng vẫn không bị ảnh hưởng.</p>\n<h2>8. Sở hữu trí tuệ</h2>\n<p>Phần mềm, tên và logo của Yaver thuộc về nhà phát triển. Bạn được cấp quyền sử dụng Yaver cho mục đích cá nhân; bạn không được sao chép, sửa đổi, cho thuê hoặc phân phối lại Yaver.</p>\n<h2>9. Thay đổi và chấm dứt</h2>\n<p>Các điều khoản này có thể được cập nhật. Khi có thay đổi quan trọng, Yaver sẽ hiển thị các điều khoản mới và yêu cầu bạn đồng ý lại để tiếp tục. Quyền truy cập dịch vụ của bạn có thể bị chấm dứt nếu bạn vi phạm các điều khoản này. Bạn có thể ngừng sử dụng Yaver bất kỳ lúc nào bằng cách gỡ cài đặt.</p>\n<h2>10. Yêu cầu về độ tuổi</h2>\n<p>Để sử dụng Yaver, bạn phải từ đủ 18 tuổi trở lên, hoặc sử dụng với sự cho phép và dưới sự giám sát của cha mẹ hoặc người giám hộ hợp pháp.</p>\n<h2>11. Luật áp dụng</h2>\n<p>Các điều khoản này chịu sự điều chỉnh của pháp luật nước Cộng hòa Thổ Nhĩ Kỳ. Tòa án và cơ quan thi hành án tại Istanbul có thẩm quyền giải quyết tranh chấp, không ảnh hưởng đến các quy định bắt buộc về thẩm quyền tại nơi bạn cư trú với tư cách là người tiêu dùng.</p>\n<h2>12. Liên hệ</h2>\n<p>Đối với câu hỏi, yêu cầu và các yêu cầu liên quan đến bảo vệ dữ liệu: <a href=\"mailto:ozdoganburak2@gmail.com\">ozdoganburak2@gmail.com</a></p>", "ja": "<h1>Yaver 利用規約およびプライバシーに関するお知らせ</h1>\n<p>バージョン 1.0 · 施行日：2026年11月2日</p>\n<p>Yaver をご利用になる前に、本規約をお読みください。「同意する」を押すことにより、お客様は本規約を読み、理解し、同意したことを確認したものとみなされます。同意されない場合は、Yaver を使用しないでください。</p>\n<h2>1. Yaver とは</h2>\n<p>Yaver は、お客様に代わってお客様の Windows コンピューターを操作する AI アシスタントです。お客様の指示を実行するために、画面のスクリーンショットを撮影して AI モデルに送信し、モデルの判断に基づいて、マウスの移動、クリック、キーボード入力、ショートカットキーの押下を行います。</p>\n<p>つまり、Yaver の実行中は、お客様のコンピューターの操作権が一時的に AI に委ねられることになります。</p>\n<h2>2. お客様の責任</h2>\n<ul>\n<li>AI は誤りを犯すことがあります。間違った場所をクリックしたり、誤ったテキストを入力したり、お客様の指示を誤解したり、予期しない操作を行ったりする可能性があります。</li>\n<li>Yaver の実行中に画面を監視し、必要に応じて停止させることはお客様の責任です。停止するには、Ctrl+Alt+D または Esc を押すか、マウスを画面の左上隅に移動してください。</li>\n<li>重要なファイルはバックアップしてください。</li>\n<li>送金、支払い、取引（トレード）、アカウントやパスワードに関する操作、公的な申請、法的または医療上の判断など、誤りが重大な結果を招くおそれのある作業に Yaver を使用しないでください。</li>\n<li>送信されたメッセージ、変更または削除されたファイル、行われた注文を含め、Yaver がお客様に代わって行うすべての操作について、お客様が責任を負います。</li>\n<li>PowerShell コマンドは常にお客様の承認を求めるために表示されます。内容を理解できないコマンドは許可しないでください。</li>\n</ul>\n<h2>3. 禁止される利用</h2>\n<p>お客様は、Yaver を以下の目的で使用してはなりません。</p>\n<ul>\n<li>違法な行為を行うこと。</li>\n<li>所有者の許可なくコンピューターまたはアカウントを操作すること。</li>\n<li>迷惑メッセージ（スパム）の送信、偽アカウントの作成、または他人へのなりすましを行うこと。</li>\n<li>CAPTCHA、ボット対策またはセキュリティ対策を回避すること。</li>\n<li>他人の権利、プライバシーまたは安全を侵害すること。</li>\n<li>Yaver のサーバー、利用上限またはセキュリティ対策の回避、リバースエンジニアリング、または不正利用を試みること。</li>\n</ul>\n<h2>4. 処理されるデータ</h2>\n<p><strong>スクリーンショットとコマンド。</strong> タスクの実行中、Yaver は画面のスクリーンショット（複数のモニターをお使いで、設定で許可されている場合はすべてのモニター）と、お客様が入力したコマンドを、Yaver サーバーを経由して AI プロバイダーである DeepSeek に送信します。その時点で画面に表示されているもの（開いている文書、メール、メッセージ、個人情報など）はすべてスクリーンショットに含まれます。Yaver の実行中は、共有したくない情報を画面に表示したままにしないでください。</p>\n<p><strong>Yaver サーバーは、お客様のスクリーンショットやコマンドを保存しません。</strong> これらは DeepSeek に転送する目的でのみ処理されます。</p>\n<p><strong>DeepSeek。</strong> DeepSeek は中華人民共和国を拠点とする AI プロバイダーです。送信されたデータは DeepSeek 独自のプライバシーポリシーおよび利用規約に従い、中国国内のサーバーで処理される場合があります。</p>\n<p><strong>利用上限のために保持される情報。</strong> 1日の利用上限を適用するため、サーバーは次の情報を保持します：初回起動時にアプリが生成する匿名のセッション ID、お客様の IP アドレスの不可逆的なダイジェスト（ハッシュ）、および1日のステップ数。お客様の氏名、メールアドレス、その他の識別情報を求めることはありません。日次カウンターは 7 日後に削除されます。サーバーは、欧州連合域内のデータセンターにある Supabase のインフラ上で稼働しています。</p>\n<p><strong>インフラの記録。</strong> サーバー基盤を提供する Supabase は、セキュリティおよび運用の目的で、お客様の IP アドレスおよびデバイス・アプリの情報をセッション記録やサーバーログに、同社所定の保存期間にわたり保存する場合があります。30 日間使用されていない匿名セッションは、関連するセッション記録とともに削除されます。</p>\n<p><strong>お客様のコンピューターに残るもの。</strong> お客様の設定、コマンド履歴、セッション情報は、お客様のコンピューターにのみ保存されます。</p>\n<p><strong>お客様の権利。</strong> 適用されるデータ保護法（GDPR やトルコの KVKK など）に基づく権利を行使するには、下記の連絡先までご連絡ください。</p>\n<h2>5. 利用上限</h2>\n<p>Yaver は無料で、公正な利用のために1日あたりの上限があります：ユーザー1人につき1日 150 ステップ（エージェントの判断1回が1ステップで、一般的なタスクには 3–8 ステップかかります）。上限は毎日トルコ時間（UTC+3）の 00:00 にリセットされます。サーバー全体の処理能力の上限に達した場合、その日の残りの時間はサービスが停止することがあります。上限は予告なく変更される場合があります。不正利用が検出された場合、アクセスが制限されることがあります。</p>\n<h2>6. 無保証</h2>\n<p>Yaver は「現状有姿」かつ「提供可能な範囲」で提供されます。中断なく、エラーなく、または特定の目的に適合して動作することは保証されません。本サービスはいつでも変更、停止または終了されることがあります。</p>\n<h2>7. 責任の制限</h2>\n<p>適用法により認められる最大限の範囲において、Yaver の開発者は、データの損失、ファイルの破損、金銭的損失、逸失利益、誤って送信されたメッセージ、または AI が行った操作を含め、Yaver の使用または使用不能から生じるいかなる直接的または間接的な損害についても責任を負いません。契約によって制限することのできない、消費者としてのお客様の法定の権利は影響を受けません。</p>\n<h2>8. 知的財産</h2>\n<p>Yaver のソフトウェア、名称およびロゴは、その開発者に帰属します。お客様には個人的な利用のために Yaver を使用する権利が付与されます。お客様は、Yaver を複製、改変、貸与または再配布することはできません。</p>\n<h2>9. 変更および終了</h2>\n<p>本規約は更新されることがあります。重要な変更がある場合、Yaver は新しい規約をお客様に表示し、引き続き利用するために改めて同意を求めます。お客様が本規約に違反した場合、本サービスへのアクセスが終了されることがあります。お客様は、Yaver をアンインストールすることにより、いつでも利用を中止できます。</p>\n<h2>10. 年齢要件</h2>\n<p>Yaver を使用するには、18 歳以上であるか、親権者または法定後見人の許可と監督のもとで使用する必要があります。</p>\n<h2>11. 準拠法</h2>\n<p>本規約はトルコ共和国の法律に準拠します。紛争については、消費者としてのお客様の居住地における強行的な管轄規定を妨げることなく、イスタンブールの裁判所および執行機関が管轄権を有します。</p>\n<h2>12. お問い合わせ</h2>\n<p>ご質問、ご要望、データ保護に関するお問い合わせ：<a href=\"mailto:ozdoganburak2@gmail.com\">ozdoganburak2@gmail.com</a></p>", "ko": "<h1>Yaver 이용약관 및 개인정보 처리 안내</h1>\n<p>버전 1.0 · 시행일: 2026년 11월 2일</p>\n<p>Yaver를 사용하기 전에 본 약관을 읽어 주십시오. &quot;동의합니다&quot;를 누르면 귀하는 본 약관을 읽고 이해했으며 이에 동의함을 확인하게 됩니다. 동의하지 않는 경우 Yaver를 사용하지 마십시오.</p>\n<h2>1. Yaver란 무엇입니까?</h2>\n<p>Yaver는 귀하를 대신하여 귀하의 Windows 컴퓨터를 조작하는 AI 어시스턴트입니다. 귀하의 명령을 수행하기 위해 화면의 스크린샷을 찍어 AI 모델로 전송하고, 모델의 결정에 따라 마우스를 움직이고, 클릭하고, 키보드로 입력하고, 단축키를 누릅니다.</p>\n<p>즉, Yaver가 실행되는 동안 귀하의 컴퓨터에 대한 제어권이 일시적으로 AI에 넘어갑니다.</p>\n<h2>2. 귀하의 책임</h2>\n<ul>\n<li>AI는 실수를 할 수 있습니다. 잘못된 위치를 클릭하거나, 잘못된 텍스트를 입력하거나, 귀하의 명령을 잘못 이해하거나, 예상하지 못한 작업을 수행할 수 있습니다.</li>\n<li>Yaver가 실행되는 동안 화면을 지켜보고 필요할 때 중지하는 것은 귀하의 책임입니다. 중지하려면 Ctrl+Alt+D 또는 Esc를 누르거나 마우스를 화면 왼쪽 위 모서리로 옮기십시오.</li>\n<li>중요한 파일은 백업해 두십시오.</li>\n<li>송금, 결제, 금융 거래(트레이딩), 계정 및 비밀번호 관련 작업, 공식 신청, 법률적 또는 의료적 결정 등 실수가 심각한 결과를 초래할 수 있는 작업에는 Yaver를 사용하지 마십시오.</li>\n<li>전송된 메시지, 변경되거나 삭제된 파일, 이루어진 주문을 포함하여 Yaver가 귀하를 대신하여 수행하는 모든 작업에 대한 책임은 귀하에게 있습니다.</li>\n<li>PowerShell 명령은 항상 귀하의 승인을 받기 위해 표시됩니다. 어떤 작업을 하는지 이해하지 못하는 명령은 허용하지 마십시오.</li>\n</ul>\n<h2>3. 금지된 사용</h2>\n<p>귀하는 다음 목적으로 Yaver를 사용할 수 없습니다.</p>\n<ul>\n<li>불법적인 행위를 하는 것.</li>\n<li>소유자의 허락 없이 컴퓨터나 계정을 조작하는 것.</li>\n<li>원치 않는 메시지(스팸)를 보내거나, 가짜 계정을 만들거나, 타인을 사칭하는 것.</li>\n<li>CAPTCHA, 봇 방지 장치 또는 보안 조치를 우회하는 것.</li>\n<li>타인의 권리, 개인정보 또는 보안을 침해하는 것.</li>\n<li>Yaver의 서버, 사용 한도 또는 보안 조치를 우회하거나, 리버스 엔지니어링하거나, 악용하려고 시도하는 것.</li>\n</ul>\n<h2>4. 어떤 데이터가 처리됩니까?</h2>\n<p><strong>스크린샷 및 명령.</strong> 작업을 수행하는 동안 Yaver는 귀하의 화면 스크린샷(모니터가 두 대 이상이고 설정에서 허용하는 경우 모든 모니터)과 귀하가 입력한 명령을 Yaver 서버를 통해 AI 제공업체인 DeepSeek로 전송합니다. 그 순간 화면에 보이는 모든 것(열려 있는 문서, 이메일, 메시지, 개인정보 등)이 스크린샷에 포함됩니다. Yaver가 실행되는 동안에는 공유하고 싶지 않은 정보를 화면에 띄워 두지 마십시오.</p>\n<p><strong>Yaver 서버는 귀하의 스크린샷이나 명령을 저장하지 않습니다.</strong> 이는 DeepSeek로 전달하기 위한 목적으로만 처리됩니다.</p>\n<p><strong>DeepSeek.</strong> DeepSeek는 중화인민공화국에 기반을 둔 AI 제공업체입니다. 전송된 데이터는 DeepSeek 자체의 개인정보 처리방침 및 이용약관의 적용을 받으며 중국 내 서버에서 처리될 수 있습니다.</p>\n<p><strong>사용 한도를 위해 보관되는 정보.</strong> 일일 사용 한도를 적용하기 위해 서버는 다음을 보관합니다: 앱이 처음 실행될 때 생성하는 익명 세션 ID, 귀하의 IP 주소에 대한 되돌릴 수 없는 요약값(해시), 그리고 귀하의 일일 단계 수. 귀하의 이름, 이메일 또는 기타 식별 정보는 요청하지 않습니다. 일일 카운터는 7일 후 삭제됩니다. 서버는 유럽연합 내 데이터 센터에 있는 Supabase 인프라에서 운영됩니다.</p>\n<p><strong>인프라 기록.</strong> 서버 인프라를 제공하는 Supabase는 보안 및 운영 목적으로 귀하의 IP 주소와 기기/앱 정보를 세션 기록 및 서버 로그에 자체 보관 기간 동안 보관할 수 있습니다. 30일 동안 사용되지 않은 익명 세션은 관련 세션 기록과 함께 삭제됩니다.</p>\n<p><strong>귀하의 컴퓨터에 남는 정보.</strong> 귀하의 설정, 명령 기록 및 세션 정보는 귀하의 컴퓨터에만 저장됩니다.</p>\n<p><strong>귀하의 권리.</strong> 관련 데이터 보호법(GDPR 또는 튀르키예의 KVKK 등)에 따른 권리를 행사하려면 아래 연락처로 문의하십시오.</p>\n<h2>5. 사용 한도</h2>\n<p>Yaver는 무료이며 공정한 사용을 위해 일일 한도가 있습니다: 사용자 1인당 하루 150단계(에이전트의 각 결정이 1단계이며, 일반적인 작업에는 3–8단계가 소요됩니다). 한도는 매일 튀르키예 시간(UTC+3) 00:00에 초기화됩니다. 서버의 전체 처리 용량에 도달하면 그날의 남은 시간 동안 서비스가 중단될 수 있습니다. 한도는 사전 통지 없이 변경될 수 있습니다. 악용이 감지되면 접근이 제한될 수 있습니다.</p>\n<h2>6. 보증의 부인</h2>\n<p>Yaver는 &quot;있는 그대로&quot; 및 &quot;이용 가능한 상태로&quot; 제공됩니다. 중단 없이, 오류 없이 또는 특정 목적에 맞게 작동한다는 보장은 없습니다. 서비스는 언제든지 변경, 일시 중단 또는 종료될 수 있습니다.</p>\n<h2>7. 책임의 제한</h2>\n<p>관련 법률이 허용하는 최대 범위 내에서, Yaver의 개발자는 데이터 손실, 파일 손상, 금전적 손실, 이익 손실, 잘못 전송된 메시지 또는 AI가 수행한 작업을 포함하여 Yaver의 사용 또는 사용 불능으로 인해 발생하는 어떠한 직접적 또는 간접적 손해에 대해서도 책임을 지지 않습니다. 계약으로 제한할 수 없는 소비자로서 귀하의 법적 권리는 영향을 받지 않습니다.</p>\n<h2>8. 지식재산권</h2>\n<p>Yaver의 소프트웨어, 이름 및 로고는 개발자에게 귀속됩니다. 귀하에게는 개인적인 용도로 Yaver를 사용할 수 있는 권리가 부여되며, 귀하는 이를 복제, 수정, 대여 또는 재배포할 수 없습니다.</p>\n<h2>9. 변경 및 해지</h2>\n<p>본 약관은 업데이트될 수 있습니다. 중요한 변경이 있는 경우 Yaver는 새로운 약관을 귀하에게 표시하고 계속 사용하기 위해 다시 동의를 요청합니다. 귀하가 본 약관을 위반하는 경우 서비스에 대한 귀하의 접근이 해지될 수 있습니다. 귀하는 언제든지 Yaver를 제거하여 사용을 중단할 수 있습니다.</p>\n<h2>10. 연령 요건</h2>\n<p>Yaver를 사용하려면 만 18세 이상이어야 하며, 그렇지 않은 경우 부모 또는 법정 후견인의 허락과 감독하에 사용해야 합니다.</p>\n<h2>11. 준거법</h2>\n<p>본 약관은 튀르키예 공화국 법률의 적용을 받습니다. 분쟁에 대해서는 소비자로서 귀하가 거주하는 지역의 강행적 관할 규정에 영향을 미치지 않는 범위에서 이스탄불의 법원 및 집행 기관이 관할권을 가집니다.</p>\n<h2>12. 연락처</h2>\n<p>문의, 요청 및 데이터 보호 관련 문의: <a href=\"mailto:ozdoganburak2@gmail.com\">ozdoganburak2@gmail.com</a></p>", "zh": "<h1>Yaver 使用条款与隐私声明</h1>\n<p>版本 1.0 · 生效日期：2026年11月2日</p>\n<p>使用 Yaver 前，请阅读本条款。点击“我同意”，即表示您确认已阅读、理解并同意本条款。如您不同意，请勿使用 Yaver。</p>\n<h2>1. Yaver 是什么？</h2>\n<p>Yaver 是一款代表您操作您的 Windows 电脑的 AI 助手。为执行您的命令，它会截取您的屏幕截图，将截图发送给 AI 模型，并根据模型的决定移动鼠标、点击、使用键盘输入以及按下快捷键。</p>\n<p>这意味着在 Yaver 运行期间，您电脑的控制权会暂时交给 AI。</p>\n<h2>2. 您的责任</h2>\n<ul>\n<li>AI 可能会出错：它可能点错位置、输入错误的文字、误解您的命令或执行意外的操作。</li>\n<li>在 Yaver 运行期间注视屏幕并在必要时将其停止，是您的责任。如需停止，请按 Ctrl+Alt+D 或 Esc，或将鼠标移至屏幕左上角。</li>\n<li>请备份您的重要文件。</li>\n<li>请勿将 Yaver 用于出错可能造成严重后果的任务，例如转账、付款、交易、账户和密码操作、官方申请，或法律或医疗决定。</li>\n<li>您须对 Yaver 代表您执行的每一项操作负责，包括已发送的消息、已更改或删除的文件以及已下的订单。</li>\n<li>PowerShell 命令始终会先显示给您审批。如果您不了解某条命令的作用，请勿允许执行。</li>\n</ul>\n<h2>3. 禁止的用途</h2>\n<p>您不得将 Yaver 用于：</p>\n<ul>\n<li>从事任何违法行为。</li>\n<li>未经所有者许可操作电脑或账户。</li>\n<li>发送未经请求的消息（垃圾信息）、创建虚假账户或冒充他人。</li>\n<li>绕过 CAPTCHA、机器人防护或安全措施。</li>\n<li>侵犯他人的权利、隐私或安全。</li>\n<li>试图绕过、逆向工程或滥用 Yaver 的服务器、使用限额或安全措施。</li>\n</ul>\n<h2>4. 处理哪些数据？</h2>\n<p><strong>屏幕截图和命令。</strong> 在执行任务期间，Yaver 会通过 Yaver 服务器将您的屏幕截图（如果您有多台显示器且设置允许，则包括所有显示器）以及您输入的命令发送给 AI 提供商 DeepSeek。当时屏幕上显示的任何内容——打开的文档、电子邮件、消息、个人信息——都会包含在截图中。Yaver 运行期间，请勿让您不想分享的信息显示在屏幕上。</p>\n<p><strong>Yaver 服务器不会存储您的屏幕截图或命令。</strong> 它们仅为转发给 DeepSeek 而被处理。</p>\n<p><strong>DeepSeek。</strong> DeepSeek 是一家总部位于中华人民共和国的 AI 提供商。所发送的数据受 DeepSeek 自身的隐私政策和使用条款约束，并可能在位于中国的服务器上处理。</p>\n<p><strong>为使用限额而保留的信息。</strong> 为执行每日使用限额，服务器会保留：应用首次启动时生成的匿名会话 ID、您 IP 地址的不可逆摘要（哈希值）以及您的每日步数。我们不会要求提供您的姓名、电子邮件或任何其他身份识别信息。每日计数器在 7 天后删除。服务器运行在位于欧盟境内数据中心的 Supabase 基础设施上。</p>\n<p><strong>基础设施记录。</strong> 提供服务器基础设施的 Supabase 可能出于安全和运营目的，在会话记录和服务器日志中按其自身的保留期限保存您的 IP 地址以及设备/应用信息。连续 30 天未使用的匿名会话将连同其会话记录一并删除。</p>\n<p><strong>保留在您电脑上的内容。</strong> 您的设置、命令历史和会话信息仅存储在您的电脑上。</p>\n<p><strong>您的权利。</strong> 如需行使适用的数据保护法律（例如 GDPR 或土耳其的 KVKK）规定的权利，请写信至下方的联系地址。</p>\n<h2>5. 使用限额</h2>\n<p>Yaver 免费提供，并为公平使用设有每日限额：每位用户每天 150 步（智能体的每一次决定为一步；一项典型任务需要 3–8 步）。限额每天于土耳其时间（UTC+3）00:00 重置。如果服务器的总容量已用尽，服务可能会在当天剩余时间内暂停。限额可能会在不事先通知的情况下变更。如发现滥用行为，访问可能会受到限制。</p>\n<h2>6. 不提供担保</h2>\n<p>Yaver 按“现状”和“现有”基础提供。我们不保证其能够不间断、无错误地运行，或适用于任何特定用途。本服务可能随时被变更、暂停或终止。</p>\n<h2>7. 责任限制</h2>\n<p>在适用法律允许的最大范围内，对于因使用或无法使用 Yaver 而产生的任何直接或间接损害，包括数据丢失、文件损坏、经济损失、利润损失、错误发送的消息或 AI 执行的操作，Yaver 的开发者概不负责。您作为消费者依法享有且不能通过合同加以限制的权利不受影响。</p>\n<h2>8. 知识产权</h2>\n<p>Yaver 的软件、名称和标志归其开发者所有。您被授予为个人用途使用 Yaver 的权利；您不得复制、修改、出租或再分发 Yaver。</p>\n<h2>9. 变更与终止</h2>\n<p>本条款可能会更新。如有重大变更，Yaver 会向您显示新条款，并再次征求您的同意方可继续使用。如您违反本条款，您对本服务的访问可能会被终止。您可以随时通过卸载 Yaver 来停止使用。</p>\n<h2>10. 年龄要求</h2>\n<p>您必须年满 18 周岁才能使用 Yaver，或在父母或法定监护人的许可和监督下使用。</p>\n<h2>11. 适用法律</h2>\n<p>本条款受土耳其共和国法律管辖。对于争议，伊斯坦布尔的法院和执行机构具有管辖权，但不影响您作为消费者在居住地适用的强制性管辖规定。</p>\n<h2>12. 联系方式</h2>\n<p>如有疑问、请求或数据保护方面的咨询，请联系：<a href=\"mailto:ozdoganburak2@gmail.com\">ozdoganburak2@gmail.com</a></p>"};
