<footer>Yaver · <a href="mailto:ozdoganburak2@gmail.com">ozdoganburak2@gmail.com</a></footer><script>const DOCS={"tr": "<h1>Yaver Kullanım Koşulları ve Gizlilik Bildirimi</h1>\n<p>Sürüm 1.0 · Yürürlük tarihi: 2 Kasım 2026</p>\n<p>Yaver&#x27;i kullanmadan önce lütfen bu koşulları okuyun. &quot;Kabul ediyorum&quot; düğmesine basarak bu koşulları okuduğunuzu, anladığınızı ve kabul ettiğinizi beyan edersiniz. Kabul etmiyorsanız Yaver&#x27;i kullanmayın.</p>\n<h2>1. Yaver nedir?</h2>\n<p>Yaver, Windows bilgisayarınızı sizin adınıza kullanan bir yapay zekâ asistanıdır. Verdiğiniz komutu yerine getirmek için ekranınızın görüntüsünü alır, bu görüntüyü bir yapay zekâ modeline gönderir ve modelin kararına göre fareyi hareket ettirir, tıklar, klavyeden yazar ve kısayol tuşlarına basar.</p>\n<p>Bu, Yaver çalışırken bilgisayarınızın kontrolünün geçici olarak yapay zekâya geçtiği anlamına gelir.</p>\n<h2>2. Sizin sorumluluğunuz</h2>\n<ul>\n<li>Yapay zekâ hata yapabilir: yanlış yere tıklayabilir, yanlış metin yazabilir, komutunuzu yanlış anlayabilir veya beklenmedik bir işlem yapabilir.</li>\n<li>Yaver çalışırken ekranı izlemeniz ve gerektiğinde durdurmanız sizin sorumluluğunuzdadır. Durdurmak için Ctrl+Alt+D&#x27;ye veya Esc&#x27;ye basabilir ya da fareyi ekranın sol üst köşesine götürebilirsiniz.</li>\n<li>Önemli dosyalarınızın yedeğini alın.</li>\n<li>Yaver&#x27;i para transferi, ödeme, alım satım, hesap ve şifre işlemleri, resmî başvurular, hukuki veya tıbbi kararlar gibi hatanın ciddi sonuç doğurabileceği işler için kullanmayın.</li>\n<li>Yaver&#x27;in sizin adınıza yaptığı tüm işlemlerin (gönderilen mesajlar, değiştirilen veya silinen dosyalar, verilen siparişler dahil) sorumluluğu size aittir.</li>\n<li>PowerShell komutları her zaman onayınıza sunulur. Ne yaptığını anlamadığınız bir komuta izin vermeyin.</li>\n</ul>\n<h2>3. Yasaklanan kullanımlar</h2>\n<p>Yaver&#x27;i şu amaçlarla kullanamazsınız:</p>\n<ul>\n<li>Yasalara aykırı herhangi bir işlem.</li>\n<li>Sahibinin izni olmayan bir bilgisayarda veya hesapta işlem yapmak.</li>\n<li>İstenmeyen ileti (spam) göndermek, sahte hesap açmak, başkalarını taklit etmek.</li>\n<li>CAPTCHA&#x27;ları, bot korumalarını veya güvenlik önlemlerini aşmak.</li>\n<li>Başkalarının haklarını, gizliliğini veya güvenliğini ihlal etmek.</li>\n<li>Yaver&#x27;in sunucusunu, kullanım sınırlarını veya güvenlik önlemlerini aşmaya, tersine mühendislikle çözmeye veya kötüye kullanmaya çalışmak.</li>\n</ul>\n<h2>4. Hangi veriler işlenir?</h2>\n<p><strong>Ekran görüntüleri ve komutlar.</strong> Yaver bir görev yaparken ekranınızın (birden fazla monitör varsa ayarlarınıza göre tümünün) görüntülerini ve yazdığınız komutları Yaver sunucusu üzerinden yapay zekâ sağlayıcısı DeepSeek&#x27;e iletir. Ekranda o an ne görünüyorsa (açık belgeler, e-postalar, mesajlar, kişisel bilgiler) görüntüye girer. Yaver çalışırken ekranda paylaşmak istemediğiniz bilgileri açık bırakmayın.</p>\n<p><strong>Yaver sunucusu ekran görüntülerinizi ve komutlarınızı saklamaz.</strong> Bunlar yalnızca DeepSeek&#x27;e iletilmek için işlenir.</p>\n<p><strong>DeepSeek.</strong> DeepSeek, Çin Halk Cumhuriyeti merkezli bir yapay zekâ sağlayıcısıdır. Gönderilen veriler DeepSeek&#x27;in kendi gizlilik politikasına ve kullanım koşullarına tabidir ve Çin&#x27;deki sunucularda işlenebilir.</p>\n<p><strong>Kullanım sınırı için tutulan bilgiler.</strong> Günlük kullanım sınırını uygulamak için sunucuda şunlar tutulur: uygulamanın ilk açılışta oluşturduğu anonim bir oturum kimliği, IP adresinizin geri döndürülemez bir özeti (hash) ve günlük adım sayınız. Adınız, e-postanız veya başka bir kimlik bilgisi istenmez. Günlük sayaçlar 7 gün sonra silinir. Sunucu Supabase altyapısında, Avrupa Birliği&#x27;ndeki veri merkezlerinde çalışır.</p>\n<p><strong>Altyapı kayıtları.</strong> Sunucu altyapısını sağlayan Supabase, güvenlik ve işletim amacıyla oturum kayıtlarında ve sunucu günlüklerinde IP adresinizi ve cihaz/uygulama bilgisini kendi saklama süreleri boyunca tutabilir. 30 gün boyunca kullanılmayan anonim oturumlar, bunlara bağlı oturum kayıtlarıyla birlikte silinir.</p>\n<p><strong>Bilgisayarınızda kalanlar.</strong> Ayarlarınız, komut geçmişiniz ve oturum bilginiz yalnızca bilgisayarınızda saklanır.</p>\n<p><strong>Haklarınız.</strong> Yürürlükteki veri koruma mevzuatı (6698 sayılı KVKK, GDPR vb.) kapsamındaki haklarınızı kullanmak için aşağıdaki iletişim adresine yazabilirsiniz.</p>\n<h2>5. Kullanım sınırları</h2>\n<p>Yaver ücretsizdir ve adil kullanım için günlük bir sınırı vardır: kullanıcı başına günde 150 adım (ajanın her kararı bir adımdır; tipik bir görev 3–8 adım sürer). Sınır her gün Türkiye saatiyle 00:00&#x27;da sıfırlanır. Sunucunun toplam kapasitesi dolarsa hizmet o gün için geçici olarak durabilir. Sınırlar önceden haber verilmeksizin değiştirilebilir. Kötüye kullanım tespit edilirse erişim kısıtlanabilir.</p>\n<h2>6. Garanti verilmemesi</h2>\n<p>Yaver &quot;olduğu gibi&quot; ve &quot;mevcut haliyle&quot; sunulur. Kesintisiz, hatasız veya belirli bir amaca uygun çalışacağı garanti edilmez. Hizmet herhangi bir zamanda değiştirilebilir, askıya alınabilir veya sonlandırılabilir.</p>\n<h2>7. Sorumluluğun sınırlandırılması</h2>\n<p>Yürürlükteki hukukun izin verdiği en geniş ölçüde, Yaver&#x27;in geliştiricisi; Yaver&#x27;in kullanımından veya kullanılamamasından doğan veri kaybı, dosya hasarı, maddi kayıp, kâr kaybı, yanlış gönderilen mesajlar veya yapay zekânın yaptığı işlemler dahil hiçbir doğrudan veya dolaylı zarardan sorumlu tutulamaz. Tüketici olarak sahip olduğunuz ve sözleşmeyle sınırlandırılamayan yasal haklarınız saklıdır.</p>\n<h2>8. Fikrî mülkiyet</h2>\n<p>Yaver&#x27;in yazılımı, adı ve logosu geliştiricisine aittir. Yaver&#x27;i kişisel kullanımınız için kullanma hakkı size tanınır; kopyalayamaz, değiştiremez, kiralayamaz veya yeniden dağıtamazsınız.</p>\n<h2>9. Değişiklikler ve fesih</h2>\n<p>Bu koşullar güncellenebilir. Önemli bir değişiklik olduğunda Yaver yeni koşulları size gösterir ve kullanmaya devam etmek için yeniden onayınızı ister. Bu koşulları ihlal etmeniz halinde hizmete erişiminiz sonlandırılabilir. Yaver&#x27;i dilediğiniz zaman kaldırarak kullanmayı bırakabilirsiniz.</p>\n<h2>10. Yaş sınırı</h2>\n<p>Yaver&#x27;i kullanmak için 18 yaşını doldurmuş olmanız veya ebeveyninizin ya da yasal velinizin izniyle ve gözetiminde kullanmanız gerekir.</p>\n<h2>11. Uygulanacak hukuk</h2>\n<p>Bu koşullar Türkiye Cumhuriyeti hukukuna tabidir. Uyuşmazlıklarda, tüketici olarak yaşadığınız yerdeki zorunlu yetki kuralları saklı kalmak kaydıyla, İstanbul mahkemeleri ve icra daireleri yetkilidir.</p>\n<h2>12. İletişim</h2>\n<p>Sorularınız, talepleriniz ve veri koruma başvurularınız için: <a href=\"mailto:ozdoganburak2@gmail.com\">ozdoganburak2@gmail.com</a></p>", "en": "<h1>Yaver Terms of Use and Privacy Notice</h1>\n<p>Version 1.0 · Effective date: November 2, 2026</p>\n<p>Please read these terms before using Yaver. By pressing &quot;I accept&quot; you confirm that you have read, understood and agree to these terms. If you do not agree, do not use Yaver.</p>\n<h2>1. What is Yaver?</h2>\n<p>Yaver is an AI assistant that operates your Windows computer on your behalf. To carry out your command it takes screenshots of your screen, sends them to an AI model, and — based on the model&#x27;s decisions — moves the mouse, clicks, types on the keyboard and presses shortcut keys.</p>\n<p>This means that while Yaver is running, control of your computer is temporarily handed to an AI.</p>\n<h2>2. Your responsibility</h2>\n<ul>\n<li>The AI can make mistakes: it may click the wrong place, type the wrong text, misunderstand your command or perform an unexpected action.</li>\n<li>It is your responsibility to watch the screen while Yaver is running and to stop it when necessary. To stop it, press Ctrl+Alt+D or Esc, or move the mouse to the top-left corner of the screen.</li>\n<li>Back up your important files.</li>\n<li>Do not use Yaver for tasks where a mistake could have serious consequences, such as money transfers, payments, trading, account and password operations, official applications, or legal or medical decisions.</li>\n<li>You are responsible for every action Yaver performs on your behalf, including messages sent, files changed or deleted, and orders placed.</li>\n<li>PowerShell commands are always shown to you for approval. Do not allow a command if you do not understand what it does.</li>\n</ul>\n<h2>3. Prohibited uses</h2>\n<p>You may not use Yaver to:</p>\n<ul>\n<li>Do anything unlawful.</li>\n<li>Operate a computer or account without its owner&#x27;s permission.</li>\n<li>Send unsolicited messages (spam), create fake accounts or impersonate others.</li>\n<li>Bypass CAPTCHAs, bot protections or security measures.</li>\n<li>Violate the rights, privacy or security of others.</li>\n<li>Attempt to bypass, reverse-engineer or abuse Yaver&#x27;s server, usage limits or security measures.</li>\n</ul>\n<h2>4. What data is processed?</h2>\n<p><strong>Screenshots and commands.</strong> While performing a task, Yaver sends screenshots of your screen (all monitors, if you have more than one and your settings allow it) and the commands you type through the Yaver server to the AI provider DeepSeek. Whatever is visible on the screen at that moment — open documents, e-mails, messages, personal information — is included in the screenshot. Do not leave information you do not want to share visible on the screen while Yaver is running.</p>\n<p><strong>The Yaver server does not store your screenshots or commands.</strong> They are processed only to be forwarded to DeepSeek.</p>\n<p><strong>DeepSeek.</strong> DeepSeek is an AI provider based in the People&#x27;s Republic of China. The data sent is subject to DeepSeek&#x27;s own privacy policy and terms of use and may be processed on servers in China.</p>\n<p><strong>Information kept for the usage limit.</strong> To enforce the daily usage limit, the server keeps: an anonymous session ID created by the app on first launch, an irreversible digest (hash) of your IP address, and your daily step count. Your name, e-mail or any other identifying information is not requested. Daily counters are deleted after 7 days. The server runs on Supabase infrastructure in data centers in the European Union.</p>\n<p><strong>Infrastructure records.</strong> Supabase, which provides the server infrastructure, may keep your IP address and device/app information in session records and server logs for security and operational purposes, for its own retention periods. Anonymous sessions that are not used for 30 days are deleted together with their session records.</p>\n<p><strong>What stays on your computer.</strong> Your settings, command history and session information are stored only on your computer.</p>\n<p><strong>Your rights.</strong> To exercise your rights under applicable data protection law (such as the GDPR or Turkey&#x27;s KVKK), write to the contact address below.</p>\n<h2>5. Usage limits</h2>\n<p>Yaver is free and has a daily limit for fair use: 150 steps per user per day (each decision of the agent is one step; a typical task takes 3–8 steps). The limit resets every day at 00:00 Turkey time (UTC+3). If the server&#x27;s total capacity is reached, the service may pause for the rest of that day. Limits may change without prior notice. Access may be restricted if abuse is detected.</p>\n<h2>6. No warranty</h2>\n<p>Yaver is provided &quot;as is&quot; and &quot;as available&quot;. It is not guaranteed to work without interruption, without errors, or for any particular purpose. The service may be changed, suspended or discontinued at any time.</p>\n<h2>7. Limitation of liability</h2>\n<p>To the fullest extent permitted by applicable law, the developer of Yaver shall not be liable for any direct or indirect damages arising from the use of or inability to use Yaver, including data loss, file damage, financial loss, loss of profit, wrongly sent messages or actions performed by the AI. Your statutory rights as a consumer that cannot be limited by contract remain unaffected.</p>\n<h2>8. Intellectual property</h2>\n<p>Yaver&#x27;s software, name and logo belong to its developer. You are granted the right to use Yaver for your personal use; you may not copy, modify, rent or redistribute it.</p>\n<h2>9. Changes and termination</h2>\n<p>These terms may be updated. When there is a significant change, Yaver will show you the new terms and ask for your consent again to continue. Your access to the service may be terminated if you violate these terms. You may stop using Yaver at any time by uninstalling it.</p>\n<h2>10. Age requirement</h2>\n<p>To use Yaver you must be at least 18 years old, or use it with the permission and under the supervision of your parent or legal guardian.</p>\n<h2>11. Governing law</h2>\n<p>These terms are governed by the laws of the Republic of Türkiye. The courts and enforcement offices of Istanbul have jurisdiction over disputes, without prejudice to mandatory jurisdiction rules of the place where you live as a consumer.</p>\n<h2>12. Contact</h2>\n<p>For questions, requests and data protection inquiries: <a href=\"mailto:ozdoganburak2@gmail.com\">ozdoganburak2@gmail.com</a></p>", "de": "<h1>Nutzungsbedingungen und Datenschutzhinweis von Yaver</h1>\n<p>Version 1.0 · Gültig ab: 2. November 2026</p>\n<p>Bitte lies diese Bedingungen, bevor du Yaver nutzt. Indem du auf „Ich stimme zu“ drückst, bestätigst du, dass du diese Bedingungen gelesen und verstanden hast und ihnen zustimmst. Wenn du nicht zustimmst, nutze Yaver nicht.</p>\n<h2>1. Was ist Yaver?</h2>\n<p>Yaver ist ein KI-Assistent, der deinen Windows-Computer in deinem Namen bedient. Um deinen Befehl auszuführen, erstellt er Screenshots deines Bildschirms, sendet sie an ein KI-Modell und bewegt – auf Grundlage der Entscheidungen des Modells – die Maus, klickt, tippt auf der Tastatur und drückt Tastenkombinationen.</p>\n<p>Das bedeutet, dass die Kontrolle über deinen Computer vorübergehend an eine KI übergeht, solange Yaver läuft.</p>\n<h2>2. Deine Verantwortung</h2>\n<ul>\n<li>Die KI kann Fehler machen: Sie kann an die falsche Stelle klicken, falschen Text eingeben, deinen Befehl missverstehen oder eine unerwartete Aktion ausführen.</li>\n<li>Es liegt in deiner Verantwortung, den Bildschirm zu beobachten, während Yaver läuft, und Yaver bei Bedarf zu stoppen. Zum Stoppen drückst du Ctrl+Alt+D oder Esc oder bewegst die Maus in die linke obere Ecke des Bildschirms.</li>\n<li>Sichere deine wichtigen Dateien.</li>\n<li>Verwende Yaver nicht für Aufgaben, bei denen ein Fehler schwerwiegende Folgen haben könnte, etwa Geldüberweisungen, Zahlungen, Handel mit Wertpapieren oder anderen Werten, Konto- und Passwortvorgänge, behördliche Anträge oder rechtliche oder medizinische Entscheidungen.</li>\n<li>Du bist für jede Aktion verantwortlich, die Yaver in deinem Namen ausführt, einschließlich gesendeter Nachrichten, geänderter oder gelöschter Dateien und aufgegebener Bestellungen.</li>\n<li>PowerShell-Befehle werden dir immer zur Freigabe angezeigt. Erlaube keinen Befehl, wenn du nicht verstehst, was er bewirkt.</li>\n</ul>\n<h2>3. Verbotene Nutzungen</h2>\n<p>Du darfst Yaver nicht verwenden, um:</p>\n<ul>\n<li>rechtswidrige Handlungen vorzunehmen.</li>\n<li>einen Computer oder ein Konto ohne Erlaubnis des Eigentümers zu bedienen.</li>\n<li>unerwünschte Nachrichten (Spam) zu versenden, gefälschte Konten zu erstellen oder dich als eine andere Person auszugeben.</li>\n<li>CAPTCHAs, Bot-Schutzmaßnahmen oder Sicherheitsvorkehrungen zu umgehen.</li>\n<li>die Rechte, die Privatsphäre oder die Sicherheit anderer zu verletzen.</li>\n<li>zu versuchen, den Server, die Nutzungslimits oder die Sicherheitsmaßnahmen von Yaver zu umgehen, durch Reverse Engineering zu analysieren oder zu missbrauchen.</li>\n</ul>\n<h2>4. Welche Daten werden verarbeitet?</h2>\n<p><strong>Screenshots und Befehle.</strong> Während Yaver eine Aufgabe ausführt, sendet es Screenshots deines Bildschirms (aller Monitore, wenn du mehrere hast und deine Einstellungen dies zulassen) sowie die von dir eingegebenen Befehle über den Yaver-Server an den KI-Anbieter DeepSeek. Alles, was in diesem Moment auf dem Bildschirm sichtbar ist – geöffnete Dokumente, E-Mails, Nachrichten, persönliche Informationen –, ist im Screenshot enthalten. Lass keine Informationen, die du nicht teilen möchtest, auf dem Bildschirm sichtbar, während Yaver läuft.</p>\n<p><strong>Der Yaver-Server speichert deine Screenshots und Befehle nicht.</strong> Sie werden ausschließlich verarbeitet, um sie an DeepSeek weiterzuleiten.</p>\n<p><strong>DeepSeek.</strong> DeepSeek ist ein KI-Anbieter mit Sitz in der Volksrepublik China. Die übermittelten Daten unterliegen der eigenen Datenschutzrichtlinie und den eigenen Nutzungsbedingungen von DeepSeek und können auf Servern in China verarbeitet werden.</p>\n<p><strong>Für das Nutzungslimit gespeicherte Informationen.</strong> Um das tägliche Nutzungslimit durchzusetzen, speichert der Server: eine anonyme Sitzungs-ID, die die App beim ersten Start erzeugt, einen nicht umkehrbaren Hashwert (Hash) deiner IP-Adresse sowie deine tägliche Schrittzahl. Dein Name, deine E-Mail-Adresse oder sonstige identifizierende Informationen werden nicht abgefragt. Die täglichen Zähler werden nach 7 Tagen gelöscht. Der Server läuft auf der Infrastruktur von Supabase in Rechenzentren in der Europäischen Union.</p>\n<p><strong>Infrastrukturprotokolle.</strong> Supabase, der Anbieter der Serverinfrastruktur, kann deine IP-Adresse sowie Geräte- und App-Informationen zu Sicherheits- und Betriebszwecken in Sitzungsdatensätzen und Serverprotokollen für die eigenen Aufbewahrungsfristen speichern. Anonyme Sitzungen, die 30 Tage lang nicht genutzt werden, werden zusammen mit ihren Sitzungsdatensätzen gelöscht.</p>\n<p><strong>Was auf deinem Computer bleibt.</strong> Deine Einstellungen, dein Befehlsverlauf und deine Sitzungsinformationen werden ausschließlich auf deinem Computer neut um deine Zustimmung, damit du Yaver weiter nutzen kannst. Wenn du gegen diese Bedingungen verstößt, kann dein Zugang zum Dienst beendet werden. Du kannst die Nutzung von Yaver jederzeit beenden, indem du es deinstallierst.</p>\n<h2>10. Altersvoraussetzung</h2>\n<p>Um Yaver zu nutzen, musst du mindestens 18 Jahre alt sein oder Yaver mit Erlaubnis und unter Aufsicht deiner Eltern oder deines gesetzlichen Vormunds verwenden.</p>\n<h2>11. Anwendbares Recht</h2>\n<p>Diese Bedingungen unterliegen dem Recht der Republik Türkei. Für Streitigkeiten sind die Gerichte und Vollstreckungsbehörden von Istanbul zuständig; zwingende Zuständigkeitsvorschriften deines Wohnorts als Verbraucher bleiben unberührt.</p>\n<h2>12. Kontakt</h2>\n<p>Für Fragen, Anliegen und Datenschutzanfragen: <a href=\"mailto:ozdoganburak2@gmail.com\">ozdoganburak2@gmail.com</a></p>", "fr": "<h1>Conditions d&#x27;utilisation et avis de confidentialité de Yaver</h1>\n<p>Version 1.0 · Date d&#x27;entrée en vigueur : 2 novembre 2026</p>\n<p>Veuillez lire les présentes conditions avant d&#x27;utiliser Yaver. En appuyant sur « J&#x27;accepte », vous confirmez avoir lu et compris les présentes conditions et les accepter. Si vous ne les acceptez pas, n&#x27;utilisez pas Yaver.</p>\n<h2>1. Qu&#x27;est-ce que Yaver ?</h2>\n<p>Yaver est un assistant d&#x27;intelligence artificielle (IA) qui utilise votre ordinateur Windows en votre nom. Pour exécuter votre commande, il prend des captures de votre écran, les envoie à un modèle d&#x27;IA et, en fonction des décisions du modèle, déplace la souris, clique, saisit du texte au clavier et appuie sur des raccourcis clavier.</p>\n<p>Cela signifie que, pendant que Yaver fonctionne, le contrôle de votre ordinateur est temporairement confié à une IA.</p>\n<h2>2. Votre responsabilité</h2>\n<ul>\n<li>L&#x27;IA peut se tromper : elle peut cliquer au mauvais endroit, saisir un texte erroné, mal comprendre votre commande ou effectuer une action inattendue.</li>\n<li>Il vous incombe de surveiller l&#x27;écran pendant que Yaver fonctionne et de l&#x27;arrêter si nécessaire. Pour l&#x27;arrêter, appuyez sur Ctrl+Alt+D ou Esc, ou déplacez la souris dans le coin supérieur gauche de l&#x27;écran.</li>\n<li>Sauvegardez vos fichiers importants.</li>\n<li>N&#x27;utilisez pas Yaver pour des tâches où une erreur pourrait avoir des conséquences graves, telles que des virements, des paiements, des opérations d&#x27;achat-vente ou de trading, des opérations sur des comptes et des mots de passe, des démarches administratives officielles ou des décisions juridiques ou médicales.</li>\n<li>Vous êtes responsable de toute action effectuée par Yaver en votre nom, y compris les messages envoyés, les fichiers modifiés ou supprimés et les commandes passées.</li>\n<li>Les commandes PowerShell vous sont toujours soumises pour approbation. N&#x27;autorisez pas une commande si vous ne comprenez pas ce qu&#x27;elle fait.</li>\n</ul>\n<h2>3. Utilisations interdites</h2>\n<p>Vous ne pouvez pas utiliser Yaver pour :</p>\n<ul>\n<li>Commettre tout acte illicite.</li>\n<li>Utiliser un ordinateur ou un compte sans l&#x27;autorisation de son propriétaire.</li>\n<li>Envoyer des messages non sollicités (spam), créer de faux comptes ou usurper l&#x27;identité d&#x27;autrui.</li>\n<li>Contourner des CAPTCHA, des protections anti-bots ou des mesures de sécurité.</li>\n<li>Porter atteinte aux droits, à la vie privée ou à la sécurité d&#x27;autrui.</li>\n<li>Tenter de contourner le serveur, les limites d&#x27;utilisation ou les mesures de sécurité de Yaver, d&#x27;en faire de l&#x27;ingénierie inverse ou d&#x27;en faire un usage abusif.</li>\n</ul>\n<h2>4. Quelles données sont traitées ?</h2>\n<p><strong>Captures d&#x27;écran et commandes.</strong> Lorsqu&#x27;il exécute une tâche, Yaver transmet des captures de votre écran (de tous vos moniteurs, si vous en avez plusieurs et que vos paramètres le permettent) ainsi que les commandes que vous saisissez, via le serveur Yaver, au fournisseur d&#x27;IA DeepSeek. Tout ce qui est visible à l&#x27;écran à ce moment-là — documents ouverts, e-mails, messages, informations personnelles — figure sur la capture. Ne laissez pas visibles à l&#x27;écran des informations que vous ne souhaitez pas partager pendant que Yaver fonctionne.</p>\n<p><strong>Le serveur Yaver ne conserve ni vos captures d&#x27;écran ni vos commandes.</strong> Elles sont traitées uniquement pour être transmises à DeepSeek.</p>\n<p><strong>DeepSeek.</strong> DeepSeek est un fournisseur d&#x27;IA établi en République populaire de Chine. Les données envoyées sont soumises à la politique de confidentialité et aux conditions d&#x27;utilisation propres à DeepSeek et peuvent être traitées sur des serveurs situés en Chine.</p>\n<p><strong>Informations conservées pour la limite d&#x27;utilisation.</strong> Pour appliquer la limite d&#x27;utilisation quotidienne, le serveur conserve : un identifiant de session anonyme créé par l&#x27;application lors de son premier lancement, une empreinte irréversible (hash) de votre adresse IP et votre nombre d&#x27;étapes quotidien. Votre nom, votre adresse e-mail ou toute autre information permettant de vous identifier ne vous sont pas demandés. Les compteurs quotidiens sont supprimés au bout de 7 jours. Le serveur fonctionne sur l&#x27;infrastructure de Supabase, dans des centres de données situés dans l&#x27;Union européenne.</p>\n<p><strong>Journaux d&#x27;infrastructure.</strong> Supabase, qui fournit l&#x27;infrastructure serveur, peut conserver votre adresse IP et des informations sur l&#x27;appareil et l&#x27;application dans les enregistrements de session et les journaux du serveur, à des fins de sécurité et d&#x27;exploitation, pendant ses propres durées de conservation. Les sessions anonymes inutilisées pendant 30 jours sont supprimées avec leurs enregistrements de session.</p>\n<p><strong>Ce qui reste sur votre ordinateur.</strong> Vos paramètres, votre historique de commandes et vos informations n<h2>9. Modifications et résiliation</h2>\n<p>Les présentes conditions peuvent être mises à jour. En cas de modification importante, Yaver vous présentera les nouvelles conditions et vous demandera à nouveau votre consentement pour continuer à l&#x27;utiliser. Votre accès au service peut être résilié si vous enfreignez les présentes conditions. Vous pouvez cesser d&#x27;utiliser Yaver à tout moment en le désinstallant.</p>\n<h2>10. Condition d&#x27;âge</h2>\n<p>Pour utiliser Yaver, vous devez être âgé d&#x27;au moins 18 ans, ou l&#x27;utiliser avec l&#x27;autorisation et sous la surveillance de votre parent ou de votre tuteur légal.</p>\n<h2>11. Droit applicable</h2>\n<p>Les présentes conditions sont régies par le droit de la République de Turquie. Sous réserve des règles de compétence impératives du lieu où vous résidez en tant que consommateur, les tribunaux et les offices d&#x27;exécution d&#x27;Istanbul sont compétents pour connaître des litiges.</p>\n<h2>12. Contact</h2>\n<p>Pour toute question, demande ou requête relative à la protection des données : <a href=\"mailto:ozdoganburak2@gmail.com\">ozdoganburak2@gmail.com</a></p>", "es": "<h1>Términos de uso y aviso de privacidad de Yaver</h1>\n<p>Versión 1.0 · Fecha de entrada en vigor: 2 de noviembre de 2026</p>\n<p>Lee estos términos antes de usar Yaver. Al pulsar «Acepto», confirmas que has leído y entendido estos términos y que los aceptas. Si no estás de acuerdo, no uses Yaver.</p>\n<h2>1. ¿Qué es Yaver?</h2>\n<p>Yaver es un asistente de inteligencia artificial (IA) que maneja tu ordenador con Windows en tu nombre. Para ejecutar tu comando, toma capturas de tu pantalla, las envía a un modelo de IA y, según las decisiones del modelo, mueve el ratón, hace clic, escribe con el teclado y pulsa atajos de teclado.</p>\n<p>Esto significa que, mientras Yaver está en funcionamiento, el control de tu ordenador pasa temporalmente a una IA.</p>\n<h2>2. Tu responsabilidad</h2>\n<ul>\n<li>La IA puede cometer errores: puede hacer clic en el lugar equivocado, escribir un texto incorrecto, malinterpretar tu comando o realizar una acción inesperada.</li>\n<li>Es tu responsabilidad vigilar la pantalla mientras Yaver está en funcionamiento y detenerlo cuando sea necesario. Para detenerlo, pulsa Ctrl+Alt+D o Esc, o mueve el ratón a la esquina superior izquierda de la pantalla.</li>\n<li>Haz copias de seguridad de tus archivos importantes.</li>\n<li>No uses Yaver para tareas en las que un error pueda tener consecuencias graves, como transferencias de dinero, pagos, operaciones de compraventa o trading, operaciones con cuentas y contraseñas, trámites oficiales o decisiones legales o médicas.</li>\n<li>Eres responsable de todas las acciones que Yaver realice en tu nombre, incluidos los mensajes enviados, los archivos modificados o eliminados y los pedidos realizados.</li>\n<li>Los comandos de PowerShell siempre se te muestran para que los apruebes. No permitas un comando si no entiendes lo que hace.</li>\n</ul>\n<h2>3. Usos prohibidos</h2>\n<p>No puedes usar Yaver para:</p>\n<ul>\n<li>Realizar cualquier actividad ilícita.</li>\n<li>Manejar un ordenador o una cuenta sin el permiso de su propietario.</li>\n<li>Enviar mensajes no solicitados (spam), crear cuentas falsas o suplantar la identidad de otras personas.</li>\n<li>Eludir CAPTCHA, protecciones contra bots o medidas de seguridad.</li>\n<li>Vulnerar los derechos, la privacidad o la seguridad de terceros.</li>\n<li>Intentar eludir el servidor, los límites de uso o las medidas de seguridad de Yaver, aplicarles ingeniería inversa o hacer un uso indebido de ellos.</li>\n</ul>\n<h2>4. ¿Qué datos se tratan?</h2>\n<p><strong>Capturas de pantalla y comandos.</strong> Mientras realiza una tarea, Yaver envía capturas de tu pantalla (de todos los monitores, si tienes más de uno y tu configuración lo permite) y los comandos que escribes, a través del servidor de Yaver, al proveedor de IA DeepSeek. Todo lo que sea visible en la pantalla en ese momento —documentos abiertos, correos electrónicos, mensajes, información personal— queda incluido en la captura. No dejes visible en la pantalla información que no quieras compartir mientras Yaver está en funcionamiento.</p>\n<p><strong>El servidor de Yaver no almacena tus capturas de pantalla ni tus comandos.</strong> Solo se tratan para reenviarlos a DeepSeek.</p>\n<p><strong>DeepSeek.</strong> DeepSeek es un proveedor de IA con sede en la República Popular China. Los datos enviados están sujetos a la política de privacidad y a los términos de uso propios de DeepSeek y pueden tratarse en servidores ubicados en China.</p>\n<p><strong>Información conservada para el límite de uso.</strong> Para aplicar el límite de uso diario, el servidor conserva: un identificador de sesión anónimo creado por la aplicación en su primer inicio, un resumen irreversible (hash) de tu dirección IP y tu número diario de pasos. No se solicita tu nombre, tu correo electrónico ni ninguna otra información identificativa. Los contadores diarios se eliminan transcurridos 7 días. El servidor funciona en la infraestructura de Supabase, en centros de datos de la Unión Europea.</p>\n<p><strong>Registros de infraestructura.</strong> Supabase, que proporciona la infraestructura del servidor, puede conservar tu dirección IP y la información del dispositivo y de la aplicación en los registros de sesión y del servidor con fines de seguridad y funcionamiento, durante sus propios plazos de conservación. Las sesiones anónimas que no se usan durante 30 días se eliminan junto con sus registros de sesión.</p>\n<p><strong>Lo que se queda en tu ordenador.</strong> Tu configuración, tu historial de comandos y tu información de sesión se almacenan únicamente en tu ordenador.</p>\n<p><strong>Tus derechos.</strong> Para ejercer tus derechos conforme a la normativa de protección de datos aplicable (como el GDPR o la KVKK de Turquía), escribe a la dirección de contacto que figura más abajo.</p>\n<h2>5. Límites de uso</h2>\n<p>Yaver es gratuito y tiene un límite diario para garantizar un uso justo: 150 pasos por usuario y día (cada decisión del agente es un paso; una tarea típica requiere 3–8 pasos). El límite se restablece cada día a las 00:00, hora de Turquía (UTC+3). Si se alcanza la capacidad total del servidor, el servicio puede quedar en pausa durante el resto del día. Los límites pueden cambiar sin previo aviso. El acceso puede restringirse si se detecta un uso abusivo.</p>\n<h2>6. Sin garantía</h2>\n<p>Yaver se ofrece «tal cual» y «según disponibilidad». No se garantiza que funcione sin interrupciones, sin errores ni que sea adecuado para un fin concreto. El servicio puede modificarse, suspenderse o interrumpirse en cualquier momento.</p>\n<h2>7. Limitación de responsabilidad</h2>\n<p>En la máxima medida permitida por la legislación aplicable, el desarrollador de Yaver no será responsable de ningún daño directo o indirecto derivado del uso o de la imposibilidad de uso de Yaver, incluidos la pérdida de datos, los daños en archivos, las pérdidas económicas, el lucro cesante, los mensajes enviados por error o las acciones realizadas por la IA. Tus derechos legales como consumidor que no pueden limitarse por contrato no se ven afectados.</p>\n<h2>8. Propiedad intelectual</h2>\n<p>El software, el nombre y el logotipo de Yaver pertenecen a su desarrollador. Se te concede el derecho a usar Yaver para tu uso personal; no puedes copiarlo, modificarlo, alquilarlo ni redistribuirlo.</p>\n<h2>9. Cambios y terminación</h2>\n<p>Estos términos pueden actualizarse. Cuando haya un cambio importante, Yaver te mostrará los nuevos términos y volverá a pedir tu consentimiento para que puedas seguir usándolo. Tu acceso al servicio puede cancelarse si incumples estos términos. Puedes dejar de usar Yaver en cualquier momento desinstalándolo.</p>\n<h2>10. Requisito de edad</h2>\n<p>Para usar Yaver debes tener al menos 18 años o usarlo con el permiso y bajo la supervisión de tu padre, madre o tutor legal.</p>\n<h2>11. Legislación aplicable</h2>\n<p>Estos términos se rigen por las leyes de la República de Turquía. Los tribunales y las oficinas de ejecución de Estambul son competentes para resolver las controversias, sin perjuicio de las normas imperativas de competencia del lugar en el que residas como consumidor.</p>\n<h2>12. Contacto</h2>\n<p>Para preguntas, solicitudes y consultas sobre protección de datos: <a href=\"mailto:ozdoganburak2@gmail.com\">ozdoganburak2@gmail.com</a></p>", "pt": "<h1>Termos de Uso e Aviso de Privacidade do Yaver</h1>\n<p>Versão 1.0 · Data de vigência: 2 de novembro de 2026</p>\n<p>Leia estes termos antes de usar o Yaver. Ao pressionar &quot;Aceito&quot;, você confirma que leu, entendeu e concorda com estes termos. Se não concordar, não use o Yaver.</p>\n<h2>1. O que é o Yaver?</h2>\n<p>O Yaver é um assistente de inteligência artificial (IA) que opera o seu computador Windows em seu nome. Para executar o seu comando, ele tira capturas da sua tela, envia-as a um modelo de IA e, com base nas decisões do modelo, move o mouse, clica, digita no teclado e pressiona teclas de atalho.</p>\n<p>Isso significa que, enquanto o Yaver está em execução, o controle do seu computador é temporariamente transferido para uma IA.</p>\n<h2>2. Sua responsabilidade</h2>\n<ul>\n<li>A IA pode cometer erros: pode clicar no lugar errado, digitar o texto errado, entender mal o seu comando ou realizar uma ação inesperada.</li>\n<li>É sua responsabilidade acompanhar a tela enquanto o Yaver está em execução e interrompê-lo quando necessário. Para interrompê-lo, pressione Ctrl+Alt+D ou Esc, ou mova o mouse para o canto superior esquerdo da tela.</li>\n<li>Faça backup dos seus arquivos importantes.</li>\n<li>Não use o Yaver para tarefas em que um erro possa ter consequências graves, como transferências de dinheiro, pagamentos, operações de compra e venda (trading), operações com contas e senhas, solicitações a órgãos oficiais ou decisões jurídicas ou médicas.</li>\n<li>Você é responsável por todas as ações que o Yaver realizar em seu nome, incluindo mensagens enviadas, arquivos alterados ou excluídos e pedidos feitos.</li>\n<li>Os comandos do PowerShell são sempre apresentados a você para aprovação. Não autorize um comando se não entender o que ele faz.</li>\n</ul>\n<h2>3. Usos proibidos</h2>\n<p>Você não pode usar o Yaver para:</p>\n<ul>\n<li>Praticar qualquer ato ilícito.</li>\n<li>Operar um computador ou uma conta sem a permissão do respectivo proprietário.</li>\n<li>Enviar mensagens não solicitadas (spam), criar contas falsas ou se passar por outras pessoas.</li>\n<li>Burlar CAPTCHA, proteções contra bots ou medidas de segurança.</li>\n<li>Violar os direitos, a privacidade ou a segurança de terceiros.</li>\n<li>Tentar burlar, fazer engenharia reversa ou abusar do servidor, dos limites de uso ou das medidas de segurança do Yaver.</li>\n</ul>\n<h2>4. Quais dados são tratados?</h2>\n<p><strong>Capturas de tela e comandos.</strong> Ao executar uma tarefa, o Yaver envia capturas da sua tela (de todos os monitores, se você tiver mais de um e suas configurações permitirem) e os comandos que você digita, por meio do servidor do Yaver, ao provedor de IA DeepSeek. Tudo o que estiver visível na tela naquele momento — documentos abertos, e-mails, mensagens, informações pessoais — é incluído na captura. Não deixe visíveis na tela informações que você não queira compartilhar enquanto o Yaver estiver em execução.</p>\n<p><strong>O servidor do Yaver não armazena suas capturas de tela nem seus comandos.</strong> Eles são tratados apenas para serem encaminhados à DeepSeek.</p>\n<p><strong>DeepSeek.</strong> A DeepSeek é um provedor de IA sediado na República Popular da China. Os dados enviados estão sujeitos à política de privacidade e aos termos de uso próprios da DeepSeek e podem ser tratados em servidores localizados na China.</p>\n<p><strong>Informações mantidas para o limite de uso.</strong> Para aplicar o limite diário de uso, o servidor mantém: um ID de sessão anônimo criado pelo aplicativo na primeira execução, um resumo irreversível (hash) do seu endereço IP e a sua contagem diária de passos. Não são solicitados seu nome, seu e-mail nem qualquer outra informação de identificação. Os contadores diários são excluídos após 7 dias. O servidor funciona na infraestrutura da Supabase, em data centers localizados na União Europeia.</p>\n<p><strong>Registros de infraestrutura.</strong> O Supabase, que fornece a infraestrutura do servidor, pode manter seu endereço IP e informações do dispositivo e do aplicativo em registros de sessão e logs do servidor, para fins de segurança e operação, pelos seus próprios prazos de retenção. Sessões anônimas não usadas por 30 dias são excluídas junto com seus registros de sessão.</p>\n<p><strong>O que fica no seu computador.</strong> Suas configurações, seu histórico de comandos e suas informações de sessão são armazenados somente no seu computador.</p>\n<p><strong>Seus direitos.</strong> Para exercer os direitos previstos na legislação de proteção de dados aplicável (como o GDPR ou a KVKK da Turquia), escreva para o endereço de contato abaixo.</p>\n<h2>5. Limites de uso</h2>\n<p>O Yaver é gratuito e tem um limite diário para uso justo: 150 passos por usuário por dia (cada decisão do agente é um passo; uma tarefa típica leva 3–8 passos). O limite é redefinido todos os dias às 00:00, horário da Turquia (UTC+3). Se a capacidade total do servidor for atingida, o serviço poderá ser pausado pelo restante do dia. Os limites podem ser alterados sem aviso prévio. O acesso poderá ser restringido se for detectado abuso.</p>\n<h2>6. Isenção de garantias</h2>\n<p>O Yaver é fornecido &quot;no estado em que se encontra&quot; e &quot;conforme disponibilidade&quot;. Não há garantia de que funcionará sem interrupções, sem erros ou para qualquer finalidade específica. O serviço pode ser alterado, suspenso ou descontinuado a qualquer momento.</p>\n<h2>7. Limitação de responsabilidade</h2>\n<p>Na máxima extensão permitida pela legislação aplicável, o desenvolvedor do Yaver não será responsável por quaisquer danos diretos ou indiretos decorrentes do uso ou da impossibilidade de uso do Yaver, incluindo perda de dados, danos a arquivos, prejuízos financeiros, lucros cessantes, mensagens enviadas por engano ou ações realizadas pela IA. Seus direitos legais como consumidor que não podem ser limitados por contrato permanecem inalterados.</p>\n<h2>8. Propriedade intelectual</h2>\n<p>O software, o nome e o logotipo do Yaver pertencem ao seu desenvolvedor. É concedido a você o direito de usar o Yaver para uso pessoal; você não pode copiá-lo, modificá-lo, alugá-lo nem redistribuí-lo.</p>\n<h2>9. Alterações e rescisão</h2>\n<p>Estes termos podem ser atualizados. Quando houver uma alteração significativa, o Yaver mostrará os novos termos e solicitará novamente o seu consentimento para que você continue a usá-lo. Seu acesso ao serviço poderá ser encerrado se você violar estes termos. Você pode deixar de usar o Yaver a qualquer momento, desinstalando-o.</p>\n<h2>10. Requisito de idade</h2>\n<p>Para usar o Yaver, você deve ter pelo menos 18 anos ou usá-lo com a permissão e sob a supervisão de seus pais ou responsável legal.</p>\n<h2>11. Lei aplicável</h2>\n<p>Estes termos são regidos pelas leis da República da Turquia. Os tribunais e os órgãos de execução de Istambul são competentes para dirimir controvérsias, sem prejuízo das regras imperativas de competência do local onde você reside como consumidor.</p>\n<h2>12. Contato</h2>\n<p>Para dúvidas, solicitações e questões sobre proteção de dados: <a href=\"mailto:ozdoganburak2@gmail.com\">ozdoganburak2@gmail.com</a></p>", "it": "<h1>Termini di utilizzo e informativa sulla privacy di Yaver</h1>\n<p>Versione 1.0 · Data di entrata in vigore: 2 novembre 2026</p>\n<p>Leggi questi termini prima di utilizzare Yaver. Premendo «Accetto» confermi di aver letto e compreso questi termini e di accettarli. Se non li accetti, non utilizzare Yaver.</p>\n<h2>1. Che cos&#x27;è Yaver?</h2>\n<p>Yaver è un assistente basato sull&#x27;intelligenza artificiale (IA) che utilizza il tuo computer Windows per conto tuo. Per eseguire il tuo comando acquisisce schermate del tuo schermo, le invia a un modello di IA e, in base alle decisioni del modello, muove il mouse, fa clic, digita sulla tastiera e preme scorciatoie da tastiera.</p>\n<p>Ciò significa che, mentre Yaver è in esecuzione, il controllo del tuo computer viene temporaneamente affidato a un&#x27;IA.</p>\n<h2>2. La tua responsabilità</h2>\n<ul>\n<li>L&#x27;IA può commettere errori: può fare clic nel punto sbagliato, digitare un testo errato, fraintendere il tuo comando o eseguire un&#x27;azione inattesa.</li>\n<li>È tua responsabilità osservare lo schermo mentre Yaver è in esecuzione e fermarlo quando necessario. Per fermarlo, premi Ctrl+Alt+D o Esc, oppure sposta il mouse nell&#x27;angolo in alto a sinistra dello schermo.</li>\n<li>Esegui il backup dei tuoi file importanti.</li>\n<li>Non utilizzare Yaver per attività in cui un errore potrebbe avere conseguenze gravi, come trasferimenti di denaro, pagamenti, compravendite o trading, operazioni su account e password, pratiche ufficiali o decisioni legali o mediche.</li>\n<li>Sei responsabile di ogni azione che Yaver esegue per conto tuo, compresi i messaggi inviati, i file modificati o eliminati e gli ordini effettuati.</li>\n<li>I comandi PowerShell ti vengono sempre mostrati per l&#x27;approvazione. Non autorizzare un comando se non capisci che cosa fa.</li>\n</ul>\n<h2>3. Usi vietati</h2>\n<p>Non puoi utilizzare Yaver per:</p>\n<ul>\n<li>Compiere qualsiasi attività illecita.</li>\n<li>Utilizzare un computer o un account senza l&#x27;autorizzazione del suo proprietario.</li>\n<li>Inviare messaggi non richiesti (spam), creare account falsi o spacciarti per altre persone.</li>\n<li>Aggirare CAPTCHA, protezioni anti-bot o misure di sicurezza.</li>\n<li>Violare i diritti, la privacy o la sicurezza di altri.</li>\n<li>Tentare di aggirare, sottoporre a reverse engineering o utilizzare in modo abusivo il server, i limiti di utilizzo o le misure di sicurezza di Yaver.</li>\n</ul>\n<h2>4. Quali dati vengono trattati?</h2>\n<p><strong>Schermate e comandi.</strong> Durante lo svolgimento di un&#x27;attività, Yaver invia le schermate del tuo schermo (di tutti i monitor, se ne hai più di uno e le tue impostazioni lo consentono) e i comandi che digiti, tramite il server di Yaver, al fornitore di IA DeepSeek. Tutto ciò che in quel momento è visibile sullo schermo — documenti aperti, e-mail, messaggi, informazioni personali — viene incluso nella schermata. Mentre Yaver è in esecuzione, non lasciare visibili sullo schermo informazioni che non vuoi condividere.</p>\n<p><strong>Il server di Yaver non conserva le tue schermate né i tuoi comandi.</strong> Vengono trattati esclusivamente per essere inoltrati a DeepSeek.</p>\n<p><strong>DeepSeek.</strong> DeepSeek è un fornitore di IA con sede nella Repubblica Popolare Cinese. I dati inviati sono soggetti all&#x27;informativa sulla privacy e ai termini di utilizzo propri di DeepSeek e possono essere trattati su server situati in Cina.</p>\n<p><strong>Informazioni conservate per il limite di utilizzo.</strong> Per applicare il limite di utilizzo giornaliero, il server conserva: un ID di sessione anonimo creato dall&#x27;app al primo avvio, un&#x27;impronta irreversibile (hash) del tuo indirizzo IP e il tuo numero di passaggi giornalieri. Non vengono richiesti il tuo nome, il tuo indirizzo e-mail né altre informazioni identificative. I contatori giornalieri vengono eliminati dopo 7 giorni. Il server funziona sull&#x27;infrastruttura di Supabase, in data center situati nell&#x27;Unione europea.</p>\n<p><strong>Registri dell&#x27;infrastruttura.</strong> Supabase, che fornisce l&#x27;infrastruttura server, può conservare il tuo indirizzo IP e le informazioni sul dispositivo e sull&#x27;app nei registri di sessione e nei log del server, per finalità di sicurezza e operative, per i propri periodi di conservazione. Le sessioni anonime non utilizzate per 30 giorni vengono eliminate insieme ai relativi registri di sessione.</p>\n<p><strong>Cosa resta sul tuo computer.</strong> Le tue impostazioni, la cronologia dei comandi e le informazioni di sessione sono memorizzate esclusivamente sul tuo computer.</p>\n<p><strong>I tuoi diritti.</strong> Per esercitare i diritti previsti dalla normativa applicabile in materia di protezione dei dati (come il GDPR o la KVKK turca), scrivi all&#x27;indirizzo di contatto indicato di seguito.</p>\n<h2>5. Limiti di utilizzo</h2>\n<p>Yaver è gratuito e prevede un limite giornaliero per garantire un utilizzo equo: 150 passaggi per utente al giorno (ogni decisione dell&#x27;agente è un passaggio; un&#x27;attività tipica richiede 3–8 passaggi). Il limite si azzera ogni giorno alle 00:00 ora della Turchia (UTC+3). Se viene raggiunta la capacità totale del server, il servizio può essere sospeso per il resto della giornata. I limiti possono essere modificati senza preavviso. L&#x27;accesso può essere limitato in caso di abuso accertato.</p>\n<h2>6. Esclusione di garanzia</h2>\n<p>Yaver è fornito «così com&#x27;è» e «secondo disponibilità». Non si garantisce che funzioni senza interruzioni, senza errori o per uno scopo particolare. Il servizio può essere modificato, sospeso o interrotto in qualsiasi momento.</p>\n<h2>7. Limitazione di responsabilità</h2>\n<p>Nella misura massima consentita dalla legge applicabile, lo sviluppatore di Yaver non sarà responsabile di alcun danno diretto o indiretto derivante dall&#x27;uso o dall&#x27;impossibilità di usare Yaver, inclusi perdita di dati, danneggiamento di file, perdite economiche, mancato guadagno, messaggi inviati per errore o azioni eseguite dall&#x27;IA. Restano salvi i tuoi diritti di legge in qualità di consumatore che non possono essere limitati per contratto.</p>\n<h2>8. Proprietà intellettuale</h2>\n<p>Il software, il nome e il logo di Yaver appartengono al suo sviluppatore. Ti viene concesso il diritto di utilizzare Yaver per uso personale; non puoi copiarlo, modificarlo, noleggiarlo né ridistribuirlo.</p>\n<h2>9. Modifiche e cessazione</h2>\n<p>Questi termini possono essere aggiornati. In caso di modifiche rilevanti, Yaver ti mostrerà i nuovi termini e ti chiederà nuovamente il consenso per continuare a utilizzarlo. Il tuo accesso al servizio può essere revocato se violi questi termini. Puoi smettere di utilizzare Yaver in qualsiasi momento disinstallandolo.</p>\n<h2>10. Requisiti di età</h2>\n<p>Per utilizzare Yaver devi avere almeno 18 anni oppure utilizzarlo con il permesso e sotto la supervisione di un genitore o del tuo tutore legale.</p>\n<h2>11. Legge applicabile</h2>\n<p>Questi termini sono regolati dalla legge della Repubblica di Turchia. Per le controversie sono competenti i tribunali e gli uffici esecutivi di Istanbul, fatte salve le norme inderogabili sulla competenza del luogo in cui risiedi in qualità di consumatore.</p>\n<h2>12. Contatti</h2>\n<p>Per domande, richieste e istanze relative alla protezione dei dati: <a href=\"mailto:ozdoganburak2@gmail.com\">ozdoganburak2@gmail.com</a></p>", "ru": "<h1>Условия использования и уведомление о конфиденциальности Yaver</h1>\n<p>Версия 1.0 · Дата вступления в силу: 2 ноября 2026 г.</p>\n<p>Пожалуйста, ознакомьтесь с настоящими условиями перед использованием Yaver. Нажимая «Принимаю», вы подтверждаете, что прочитали и поняли настоящие условия и согласны с ними. Если вы не согласны, не используйте Yaver.</p>\n<h2>1. Что такое Yaver?</h2>\n<p>Yaver — это ИИ-ассистент, который управляет вашим компьютером с Windows от вашего имени. Чтобы выполнить вашу команду, он делает снимки вашего экрана, отправляет их модели искусственного интеллекта и на основе решений модели перемещает мышь, выполняет щелчки, вводит текст с клавиатуры и нажимает сочетания клавиш.</p>\n<p>Это означает, что во время работы Yaver управление вашим компьютером временно передаётся ИИ.</p>\n<h2>2. Ваша ответственность</h2>\n<ul>\n<li>ИИ может ошибаться: он может щёлкнуть не в том месте, ввести неверный текст, неправильно понять вашу команду или выполнить неожиданное действие.</li>\n<li>Вы обязаны следить за экраном во время работы Yaver и при необходимости останавливать его. Чтобы остановить его, нажмите Ctrl+Alt+D или Esc либо переместите указатель мыши в левый верхний угол экрана.</li>\n<li>Создавайте резервные копии важных файлов.</li>\n<li>Не используйте Yaver для задач, в которых ошибка может привести к серьёзным последствиям, например для денежных переводов, платежей, торговых операций, действий с учётными записями и паролями, подачи официальных заявлений, а также принятия юридических или медицинских решений.</li>\n<li>Вы несёте ответственность за все действия, которые Yaver выполняет от вашего имени, включая отправленные сообщения, изменённые или удалённые файлы и оформленные заказы.</li>\n<li>Команды PowerShell всегда выводятся вам на подтверждение. Не разрешайте выполнение команды, если не понимаете, что она делает.</li>\n</ul>\n<h2>3. Запрещённое использование</h2>\n<p>Вы не можете использовать Yaver, чтобы:</p>\n<ul>\n<li>Совершать любые противоправные действия.</li>\n<li>Управлять компьютером или учётной записью без разрешения их владельца.</li>\n<li>Рассылать нежелательные сообщения (спам), создавать поддельные учётные записи или выдавать себя за других лиц.</li>\n<li>Обходить CAPTCHA, защиту от ботов или меры безопасности.</li>\n<li>Нарушать права, неприкосновенность частной жизни или безопасность других лиц.</li>\n<li>Пытаться обойти, подвергнуть обратной разработке или использовать во вред сервер Yaver, ограничения на использование или меры безопасности.</li>\n</ul>\n<h2>4. Какие данные обрабатываются?</h2>\n<p><strong>Снимки экрана и команды.</strong> При выполнении задачи Yaver передаёт снимки вашего экрана (всех мониторов, если их несколько и это разрешено вашими настройками) и вводимые вами команды через сервер Yaver поставщику ИИ DeepSeek. Всё, что в этот момент видно на экране, — открытые документы, электронные письма, сообщения, личная информация — попадает на снимок. Не оставляйте на экране информацию, которой не хотите делиться, пока работает Yaver.</p>\n<p><strong>Сервер Yaver не хранит ваши снимки экрана и команды.</strong> Они обрабатываются исключительно для передачи в DeepSeek.</p>\n<p><strong>DeepSeek.</strong> DeepSeek — поставщик ИИ, расположенный в Китайской Народной Республике. На отправленные данные распространяются собственная политика конфиденциальности и условия использования DeepSeek; данные могут обрабатываться на серверах в Китае.</p>\n<p><strong>Данные, хранимые для соблюдения лимита.</strong> Для применения дневного лимита использования сервер хранит: анонимный идентификатор сеанса, создаваемый приложением при первом запуске, необратимую свёртку (хеш) вашего IP-адреса и количество ваших шагов за день. Ваше имя, адрес электронной почты или иные идентифицирующие сведения не запрашиваются. Дневные счётчики удаляются через 7 дней. Сервер работает на инфраструктуре Supabase в центрах обработки данных в Европейском союзе.</p>\n<p><strong>Журналы инфраструктуры.</strong> Supabase, предоставляющий серверную инфраструктуру, может хранить ваш IP-адрес и сведения об устройстве и приложении в записях сеансов и журналах сервера в целях безопасности и эксплуатации в течение собственных сроков хранения. Анонимные сеансы, которые не используются 30 дней, удаляются вместе с записями сеансов.</p>\n<p><strong>Что остаётся на вашем компьютере.</strong> Ваши настройки, история команд и данные сеанса хранятся только на вашем компьютере.</p>\n<p><strong>Ваши права.</strong> Чтобы воспользоваться своими правами в соответствии с применимым законодательством о защите данных (например, GDPR или турецким KVKK), напишите по контактному адресу, указанному ниже.</p>\n<h2>5. Лимиты использования</h2>\n<p>Yaver бесплатен и имеет дневной лимит для справедливого использования: 150 шагов на пользователя в день (каждое решение агента — один шаг; типичная задача занимает 3–8 шагов). Лимит сбрасывается ежедневно в 00:00 по времени Турции (UTC+3). Если общая мощность сервера исчерпана, работа сервиса может быть приостановлена до конца этого дня. Лимиты могут быть изменены без предварительного уведомления. При выявлении злоупотреблений доступ может быть ограничен.</p>\n<h2>6. Отказ от гарантий</h2>\n<p>Yaver предоставляется «как есть» и «по мере доступности». Не гарантируется, что он будет работать бесперебойно, без ошибок или подходить для какой-либо конкретной цели. Сервис может быть изменён, приостановлен или прекращён в любое время.</p>\n<h2>7. Ограничение ответственности</h2>\n<p>В максимальной степени, допускаемой применимым законодательством, разработчик Yaver не несёт ответственности за любой прямой или косвенный ущерб, возникший в результате использования или невозможности использования Yaver, включая потерю данных, повреждение файлов, финансовые убытки, упущенную выгоду, ошибочно отправленные сообщения или действия, выполненные ИИ. Ваши законные права потребителя, которые не могут быть ограничены договором, остаются в силе.</p>\n<h2>8. Интеллектуальная собственность</h2>\n<p>Программное обеспечение, название и логотип Yaver принадлежат его разработчику. Вам предоставляется право использовать Yaver в личных целях; вы не вправе копировать, изменять, сдавать в аренду или повторно распространять его.</p>\n<h2>9. Изменения и прекращение</h2>\n<p>Настоящие условия могут обновляться. При существенных изменениях Yaver покажет вам новые условия и снова запросит ваше согласие для продолжения использования. В случае нарушения вами настоящих условий ваш доступ к сервису может быть прекращён. Вы можете в любое время прекратить использование Yaver, удалив его.</p>\n<h2>10. Возрастные требования</h2>\n<p>Чтобы пользоваться Yaver, вам должно быть не менее 18 лет либо вы должны использовать его с разрешения и под присмотром родителя или законного опек
